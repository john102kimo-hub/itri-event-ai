<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>記者會報到</title>
<style>
  :root{ --brand:#0F9E7A; --brand-dark:#0a6b52; --ink:#16211f; --muted:#6b7b79;
         --line:#dfe7e6; --bg:#f4f7f7; --ok:#0d8a4f; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:26px 16px 22px}
  header .in,.wrap{max-width:520px;margin:0 auto}
  .wrap{padding:0 16px 48px}
  h1{margin:0 0 6px;font-size:20px;line-height:1.35;font-weight:700}
  .meta{font-size:13px;opacity:.85;line-height:1.7}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
  input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;
        font-family:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--brand)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.6}
  .results{margin-top:12px;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .row{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);
       border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff}
  .row:active{background:#eef5f5}
  .row .nm{font-weight:600;font-size:15.5px}
  .row .ol{font-size:13px;color:var(--muted);margin-top:2px}
  .row .go{margin-left:auto;color:var(--brand);font-size:13px;font-weight:600;white-space:nowrap}
  button{width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:9px;
         background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;margin-top:14px}
  button:disabled{opacity:.55}
  button.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .empty{padding:18px 4px;color:var(--muted);font-size:14px;text-align:center;line-height:1.8}
  .done{text-align:center;padding:30px 12px}
  .tick{width:66px;height:66px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;
        line-height:66px;margin:0 auto 16px}
  .done h2{margin:0 0 8px;font-size:22px}
  .done p{color:var(--muted);font-size:14.5px;margin:0;line-height:1.8}
  .seq{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:20px;
       background:#e8f3f2;color:var(--brand-dark);font-size:13px;font-weight:600}
  .err{background:#fdecec;border-color:#f5c2c2;color:#9c2020;font-size:14px;line-height:1.7}
</style>
</head>
<body>

<header><div class="in">
  <h1 id="evName">載入中…</h1>
  <div class="meta" id="evMeta"></div>
</div></header>

<div class="wrap">
  <div class="card" id="stepSearch" style="display:none">
    <label for="q">請輸入您的姓名或媒體名稱</label>
    <input id="q" type="search" autocomplete="off" placeholder="例：李珣瑛　或　經濟日報">
    <div class="hint">系統僅比對本場邀請名單的姓名與媒體，不會顯示任何聯絡資料。</div>
    <div class="results" id="results"></div>
    <button class="ghost" id="btnManual">找不到我的名字，手動填寫</button>
  </div>

  <div class="card" id="stepManual" style="display:none">
    <label for="mName">姓名</label>
    <input id="mName" autocomplete="off" placeholder="您的姓名">
    <label for="mOutlet" style="margin-top:14px">媒體名稱</label>
    <input id="mOutlet" autocomplete="off" placeholder="服務單位">
    <button id="btnManualGo">完成報到</button>
    <button class="ghost" id="btnBack">返回搜尋</button>
  </div>

  <div class="card done" id="stepDone" style="display:none">
    <div class="tick">✓</div>
    <h2>報到完成</h2>
    <p id="doneWho"></p>
    <div class="seq" id="doneSeq"></div>
    <button id="btnRoom">進入數位新聞資料室</button>
  </div>

  <div class="card err" id="stepErr" style="display:none"></div>
</div>

<script>
const EV = new URLSearchParams(location.search).get('id') || '';
let timer = null;

const $ = id => document.getElementById(id);
const show = s => ['stepSearch','stepManual','stepDone','stepErr']
  .forEach(x => $(x).style.display = (x === s ? 'block' : 'none'));
const fail = m => { $('stepErr').textContent = m; show('stepErr'); };

async function api(qs) {
  const r = await fetch('/api/checkin?' + qs);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '連線失敗');
  return j;
}
async function post(payload) {
  const r = await fetch('/api/checkin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '連線失敗');
  return j;
}

(async () => {
  if (!EV) return fail('網址缺少活動代碼。請重新掃描現場的 QR Code。');
  try {
    const { event } = await api('action=event&id=' + encodeURIComponent(EV));
    if (event.color) {
      document.documentElement.style.setProperty('--brand', event.color);
      document.documentElement.style.setProperty('--brand-dark', event.color);
    }
    $('evName').textContent = event.name;
    $('evMeta').textContent = [event.date, event.organizer].filter(Boolean).join('　·　');
    show('stepSearch');
    $('q').focus();
  } catch (e) { fail(e.message); }
})();

$('q').addEventListener('input', function () {
  clearTimeout(timer);
  const kw = this.value.trim();
  if (!kw) { $('results').innerHTML = ''; return; }
  timer = setTimeout(async () => {
    try {
      const { results } = await api('action=search&id=' + encodeURIComponent(EV) + '&q=' + encodeURIComponent(kw));
      render(results);
    } catch (e) { /* 搜尋失敗不擋流程，記者仍可手動填寫 */ }
  }, 250);
});

function render(list) {
  const box = $('results');
  if (!list.length) {
    box.innerHTML = '<div class="empty">名單中沒有相符的資料。<br>可能是新接手的路線 —— 請點下方手動填寫。</div>';
    return;
  }
  box.innerHTML = '';
  list.forEach(p => {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div><div class="nm"></div><div class="ol"></div></div><div class="go">這是我 ›</div>';
    d.querySelector('.nm').textContent = p.name;
    d.querySelector('.ol').textContent = p.outlet;
    d.onclick = () => submit({ id: EV, rid: p.rid, name: p.name, outlet: p.outlet }, d);
    box.appendChild(d);
  });
}

async function submit(payload, el) {
  if (el) { el.style.opacity = '.5'; el.style.pointerEvents = 'none'; }
  try {
    const r = await post({ action: 'checkin', ...payload });
    $('doneWho').textContent = payload.outlet + '　' + payload.name;
    $('doneSeq').textContent = r.dup ? '您稍早已完成報到' : '第 ' + r.seq + ' 位報到';
    $('btnRoom').onclick = () => location.href = '/event?id=' + encodeURIComponent(EV);
    show('stepDone');
  } catch (e) {
    if (el) { el.style.opacity = ''; el.style.pointerEvents = ''; }
    const b = $('btnManualGo'); b.disabled = false; b.textContent = '完成報到';
    fail('報到失敗：' + e.message + '　請重試，或向現場工作人員登記。');
  }
}

$('btnManual').onclick = () => { show('stepManual'); $('mName').focus(); };
$('btnBack').onclick = () => show('stepSearch');
$('btnManualGo').onclick = function () {
  const n = $('mName').value.trim(), o = $('mOutlet').value.trim();
  if (!n || !o) return alert('請填寫姓名與媒體名稱。');
  this.disabled = true; this.textContent = '送出中…';
  submit({ id: EV, rid: '', name: n, outlet: o });
};
</script>
</body>
</html>
