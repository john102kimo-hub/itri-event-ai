<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒體訓練模式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css">
<style>
  :root {
    --primary: #e85d04;
    --primary-dark: #c44d03;
    --primary-light: rgba(232,93,4,0.08);
    --text: #1a1a2e;
    --muted: #6b7280;
    --bg: #fdf5f0;
    --card: #ffffff;
    --border: #e5e7eb;
    --radius: 12px;
    --font: 'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* 批次 72：固定在畫面上的只剩 header、進度條、作答區，其餘全部在這一塊裡捲。
     舊版說明卡與媒體橫幅整場都佔著固定高度，iPhone 上作答時對話區只剩兩百多 px。 */
  #scroller { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
  /* 開始後說明卡就功成身退——它講的是「開始前要知道的事」，留著只是佔掉對話的位置 */
  body.started #info-card { display: none; }

  #header {
    background: var(--primary);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  /* 活動名稱常常很長（「經濟部四足機器人國產研發平台發表記者會」），手機上折成兩行
     會把 header 撐到將近 100px、右邊的按鈕被擠成直排三個字。收成一行、超出用省略號。 */
  #header-text { flex: 1; min-width: 0; }
  #header h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header p { font-size: 0.78rem; opacity: 0.85; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #back-link {
    margin-left: auto; white-space: nowrap; flex-shrink: 0;
    color: rgba(255,255,255,0.8);
    font-size: 0.82rem;
    text-decoration: none;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    transition: all 0.15s;
  }
  #back-link:hover { background: rgba(255,255,255,0.15); color: white; }

  /* 說明卡片 */
  #info-card {
    margin: 12px 16px 0;
    background: var(--primary-light);
    border: 1px solid rgba(232,93,4,0.2);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #7c3a0a;
    line-height: 1.6;
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  #info-card i { font-size: 20px; color: var(--primary); flex-shrink: 0; margin-top: 1px; }

  /* 進度條 */
  #progress-bar {
    padding: 10px 16px 4px;
    flex-shrink: 0;
  }
  #progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  #progress-track { height: 6px; background: var(--border); border-radius: 3px; }
  #progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s; width: 0%; }

  /* Chat —— 捲動交給外層的 #scroller，這裡只負責排版 */
  #messages {
    padding: 12px 16px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #messages:empty { display: none; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .msg.reporter .avatar { background: #1a1a2e; color: white; }
  .msg.user .avatar { background: #0F9E7A; color: white; }
  .msg.eval .avatar { background: #6366f1; color: white; }
  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.reporter .bubble {
    background: #1a1a2e; color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .msg.reporter .bubble .label {
    display: inline-block;
    background: var(--primary);
    color: white;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
  }
  .msg.user .bubble { background: #0F9E7A; color: white; border-bottom-right-radius: 4px; }
  .msg.eval .bubble {
    background: #f0f0ff;
    border: 1px solid #c7d2fe;
    border-bottom-left-radius: 4px;
    color: #3730a3;
  }
  .msg.eval .bubble .eval-label {
    display: inline-block;
    background: #6366f1;
    color: white;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
  }

  /* 分數徽章 */
  .score-badge {
    display: inline-block;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
    margin-right: 4px;
  }
  .score-badge .of10 { font-size: 0.9rem; font-weight: 600; color: var(--muted); }

  /* Typing */
  .typing-dot { display: inline-block; width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

  /* Input */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: white;
    display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 16px;
    resize: none; overflow-y: auto; max-height: 120px;
    line-height: 1.5; outline: none;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: #0F9E7A; }
  #user-input:disabled { background: #f9fafb; color: var(--muted); }
  #send-btn {
    width: 44px; height: 44px;
    border: none; border-radius: 10px;
    background: #0F9E7A; color: white;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { background: #0a7a60; }
  #send-btn:disabled { background: var(--border); cursor: default; }

  /* ── 語音作答 ──────────────────────────────────────────────── */
  #input-area.voice { flex-direction: column; align-items: stretch; gap: 8px; }
  #voice-pane, #confirm-pane, #type-pane { display: flex; flex-direction: column; gap: 8px; }
  #type-pane { flex-direction: row; align-items: flex-end; gap: 10px; }

  #mic-row { display: flex; align-items: center; gap: 10px; }
  #mic-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px;
    background: #0F9E7A; color: white;
    padding: 14px 20px;
    font-family: var(--font); font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  #mic-btn:hover:not(:disabled) { background: #0a7a60; }
  #mic-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
  #mic-btn.recording { background: #dc2626; }
  #mic-btn.recording:hover { background: #b91c1c; }
  #mic-btn i { font-size: 20px; }

  .link-btn {
    background: none; border: none;
    color: var(--muted); font-family: var(--font); font-size: 0.82rem;
    text-decoration: underline; cursor: pointer; padding: 6px 2px;
    flex-shrink: 0;
  }
  .link-btn:hover { color: var(--primary); }

  #rec-status { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
  .rec-row { display: flex; align-items: center; gap: 8px; }
  #rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #dc2626; animation: pulse 1s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  #rec-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); font-size: 0.95rem; }
  #rec-target { font-size: 0.74rem; flex-shrink: 0; }
  #rec-hint { font-size: 0.78rem; }

  /* 講到第幾秒就換一次顏色與提示。真實媒體訓練師會在旁邊比手勢示意收尾，
     這幾行就是那個手勢——事後在評語裡才被告知「你講太久了」，已經來不及了。 */
  #rec-status.zone-target #rec-time { color: #0F9E7A; }
  #rec-status.zone-target #rec-hint { color: #0F9E7A; font-weight: 600; }
  #rec-status.zone-long #rec-time,
  #rec-status.zone-long #rec-hint { color: #d97706; font-weight: 700; }
  #rec-status.zone-toolong #rec-time,
  #rec-status.zone-toolong #rec-hint { color: #dc2626; font-weight: 700; }
  #rec-status.zone-long #level-fill { background: #d97706; }
  #rec-status.zone-toolong #level-fill { background: #dc2626; }

  /* 音量條不是裝飾。「按了錄音但麥克風其實沒收到聲音」是這種介面最常見的失敗，
     而且失敗當下毫無徵兆——講完兩分鐘才發現整段是空的。這條會動，才代表真的錄到。 */
  /* 寬螢幕上不要讓它拉滿整行：這條顯示的是「瞬間音量」，會跟著每個音節劇烈跳動，
     一條 1000px 寬的東西在旁邊狂閃，反而會把注意力從計時器上拉走。 */
  #level-track { flex: 0 1 200px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 40px; }
  #level-fill { height: 100%; width: 0%; background: #0F9E7A; border-radius: 3px; transition: width 0.08s linear; }
  #rec-status.silent #level-fill { background: #f59e0b; }
  #rec-status.silent #rec-hint { color: #b45309; font-weight: 600; }

  #live-caption {
    background: #f9fafb; border: 1px dashed var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.86rem; line-height: 1.6; color: var(--muted);
    max-height: 90px; overflow-y: auto;
  }

  #confirm-pane .confirm-head {
    font-size: 0.8rem; color: var(--primary); font-weight: 600;
    display: flex; align-items: center; gap: 5px;
  }
  #transcript-box {
    border: 1.5px solid #0F9E7A; border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    resize: none; overflow-y: auto; max-height: 160px; outline: none;
  }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button {
    border-radius: 10px; padding: 11px 16px;
    font-family: var(--font); font-size: 0.9rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: none; transition: background 0.2s;
  }
  #redo-btn { background: white; border: 1.5px solid var(--border); color: var(--muted); }
  #redo-btn:hover { border-color: var(--primary); color: var(--primary); }
  #confirm-send-btn { flex: 1; background: #0F9E7A; color: white; }
  #confirm-send-btn:hover:not(:disabled) { background: #0a7a60; }
  #confirm-send-btn:disabled { background: var(--border); cursor: default; }

  #voice-note { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  #voice-note.warn { color: #b45309; }

  /* 作答方式標記（貼在使用者泡泡下面，讓人看得出這題是講的還是打的） */
  .msg.user .meta {
    display: block; margin-top: 5px;
    font-size: 0.72rem; opacity: 0.75;
  }
  .msg.user .meta.over { opacity: 1; color: #fde68a; font-weight: 700; }

  /* 開始按鈕 */
  #start-area {
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #trainee-input {
    width: 100%; max-width: 320px;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    /* ⚠️ 16px 是下限，不是美感選擇。iOS Safari 對 font-size 小於 16px 的輸入框，
       一 focus 就會自動放大整個頁面——而且**放大後不會自己縮回來**。這一欄原本是
       0.9rem（14.4px），主管在開始畫面點一下姓名，整場訓練就都在放大狀態下進行：
       header 被狀態列蓋住、進度條左右被裁掉。回報的截圖就是這個症狀。
       正解是把字級拉到 16px，不是用 maximum-scale=1 禁止縮放（那會害到真的需要
       放大來看的人）。 */
    font-family: var(--font); font-size: 16px;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  #trainee-input:focus { border-color: var(--primary); }
  /* 負責主題。跟姓名欄同一套樣式，字級一樣不得低於 16px（見上面那段 iOS 說明）。 */
  #focus-input {
    width: 100%; max-width: 320px;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 16px;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  #focus-input:focus { border-color: var(--primary); }

  /* 開場先問「今天受訪的是誰」——題目會跟著職務換一批。 */
  #who-ask { font-size: .82rem; color: var(--muted); text-align: center; max-width: 340px; line-height: 1.6; }
  #role-picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 380px; }
  .role-chip {
    border: 1.5px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 12px; cursor: pointer; font-family: var(--font);
    text-align: left; line-height: 1.35; color: var(--text);
  }
  .role-chip b { display: block; font-size: .88rem; font-weight: 700; }
  .role-chip span { font-size: .72rem; color: var(--muted); }
  .role-chip.on { border-color: var(--primary); background: var(--primary-light, #e7f6f2); }
  .role-chip.on b { color: var(--primary); }

  /* 今天是哪一家媒體來訪。真實的媒體訓練，第一件事就是告訴受訓者今天誰來。 */
  #outlet-banner {
    display: none; margin: 0 16px 10px; padding: 10px 14px;
    border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: 8px; background: #fff; font-size: .8rem; line-height: 1.55; color: var(--muted);
  }
  #outlet-banner b { color: var(--text); }
  #outlet-banner .sim { display: block; margin-top: 4px; font-size: .7rem; color: #9ca3af; }
  #outlet-banner { margin-top: 12px; flex-shrink: 0; }

  /* 題數：3 題快速／5 題完整。主管的時間是零碎的，門檻降下來才會有第二次。 */
  #qcount-picker { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 380px; }
  .q-chip {
    border: 1.5px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 14px; cursor: pointer; font-family: var(--font); color: var(--text);
    font-size: .85rem; line-height: 1.35; text-align: center;
  }
  .q-chip b { display: block; font-size: .9rem; }
  .q-chip span { font-size: .72rem; color: var(--muted); }
  .q-chip.on { border-color: var(--primary); background: var(--primary-light); }
  .q-chip.on b { color: var(--primary); }

  /* 上次練習（存在這台裝置上）：看得到自己上次卡在哪，才會想再練一次 */
  #last-session, #resume-box {
    width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: .8rem; line-height: 1.6; color: var(--muted);
  }
  #last-session b, #resume-box b { color: var(--text); }
  #resume-box { border-color: var(--primary); border-left-width: 3px; }
  .resume-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  #resume-btn {
    background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 8px 16px;
    font-family: var(--font); font-size: .88rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }

  /* 等太久時的一句話。打點點轉二十秒，人會以為當掉了。 */
  .wait-hint { display: block; margin-top: 6px; font-size: .74rem; opacity: .75; }

  /* 連線失敗時的重試。沒有這顆按鈕，一次網路中斷就毀掉整場五題的演練。 */
  .retry-btn {
    margin-top: 8px; border: 1.5px solid var(--primary); background: #fff; color: var(--primary);
    border-radius: 8px; padding: 6px 14px; font-family: var(--font); font-size: .82rem;
    font-weight: 700; cursor: pointer;
  }
  #start-btn {
    background: var(--primary); color: white;
    border: none; border-radius: 10px;
    padding: 14px 32px;
    font-family: var(--font); font-size: 1rem; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
    /* 手機上開始畫面比一個螢幕高（身分五顆＋題數＋兩個欄位），舊版這顆按鈕在畫面外，
       要往下捲才知道有它。黏在捲動區底部，不論捲到哪都看得到。 */
    position: sticky; bottom: 12px; z-index: 2;
    box-shadow: 0 4px 14px rgba(232,93,4,0.35);
  }
  #start-btn:hover { background: var(--primary-dark); }

  /* 結束畫面——在捲動區裡，跟對話接在一起，不再是一塊把對話擠扁的固定區塊 */
  #end-screen {
    display: none;
    margin: 4px 16px 24px; padding: 22px 18px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    text-align: center;
    flex-shrink: 0;
  }
  #end-screen .trophy { font-size: 44px; margin-bottom: 6px; }
  #end-screen h2 { font-size: 1.25rem; margin-bottom: 6px; }
  #end-avg { font-weight: 700; color: var(--primary); font-size: 1.05rem; margin-bottom: 14px; }
  #report-body { text-align: left; font-size: .88rem; line-height: 1.7; }
  #report-body h3 { font-size: .92rem; margin: 14px 0 6px; color: var(--text); }
  #report-body ol { padding-left: 1.3em; }
  #report-body li { margin-bottom: 4px; }
  #report-body blockquote {
    margin: 0; padding: 8px 12px; border-left: 3px solid var(--primary);
    background: var(--primary-light); border-radius: 6px; font-weight: 600;
  }
  #report-body .q-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--border); }
  #report-body .q-row:first-child { border-top: none; }
  #report-body .q-score { font-weight: 800; color: var(--primary); min-width: 2.6em; }
  #report-body .q-score.low { color: #dc2626; }
  #report-body .q-meta { font-size: .74rem; color: var(--muted); }
  #report-body .q-text { flex: 1; min-width: 0; }
  .end-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .end-actions button {
    border-radius: 10px; padding: 10px 16px; font-family: var(--font); font-size: .88rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    background: #fff; color: var(--primary); border: 1.5px solid var(--primary);
  }
  #restart-btn { background: var(--primary); color: white; border-color: var(--primary); }
  #restart-btn:hover { background: var(--primary-dark); }
  #copy-note { font-size: .78rem; color: #0F9E7A; min-height: 1em; margin-top: 8px; }

  /* Loading */
  #loading {
    position: fixed; inset: 0;
    background: rgba(253,245,240,0.9);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; font-size: 0.95rem; color: var(--muted);
    z-index: 100;
  }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>載入活動資訊中…</span>
</div>

<div id="header">
  <i class="ti ti-microphone" style="font-size:26px"></i>
  <div id="header-text">
    <h1 id="event-title">媒體訓練模式</h1>
    <p id="event-subtitle">AI 記者實戰演練</p>
  </div>
  <a id="back-link" href="/"><i class="ti ti-arrow-left"></i> <span id="back-label">回後台</span></a>
</div>

<div id="progress-bar">
  <div id="progress-label">
    <span>訓練進度</span>
    <span id="q-counter">0 / 5 題</span>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<!-- 批次 72：說明卡、媒體橫幅、對話、開始區、結算報告全部放進同一個捲動區。
     舊版它們各自佔一塊固定高度，手機上作答時對話區只剩兩百多 px，評分泡泡幾乎看不到。 -->
<div id="scroller">
  <div id="info-card">
    <i class="ti ti-info-circle"></i>
    <span>AI 將扮演犀利記者向您提問，<strong>直接用講的回答就好</strong>，不用打字。每題請在 <strong>30 秒到 1 分鐘內把重點講完</strong>——這是記者真正用得到的長度。每題回答後 AI 會就您講的內容與長度評分。題數可選 <strong>3 題（快速）</strong>或 <strong>5 題（完整）</strong>，練完會給您一份帶得走的重點。</span>
  </div>

  <div id="outlet-banner"></div>

  <div id="messages"></div>

  <div id="start-area">
    <!-- 上次練到一半就中斷（重新整理、切去設定開麥克風權限、來電）時，讓他接著練 -->
    <div id="resume-box" style="display:none">
      <div id="resume-text"></div>
      <div class="resume-actions">
        <button id="resume-btn" type="button"><i class="ti ti-player-play"></i> 接著練</button>
        <button id="discard-btn" type="button" class="link-btn">重新開始</button>
      </div>
    </div>
    <div id="last-session" style="display:none"></div>
    <div id="who-ask">開始前先告訴 AI 記者，今天受訪的是誰——<b>題目會跟著您的職務換一批</b>。
      院長被問的跟計畫主持人被問的，本來就不是同一批問題。</div>
    <div id="role-picker"></div>
    <div id="qcount-picker"></div>
    <input id="trainee-input" type="text" maxlength="40"
           placeholder="您的姓名／職稱（選填，方便主管追蹤訓練紀錄）">
    <input id="focus-input" type="text" maxlength="60"
           placeholder="您負責的題目／領域（選填，例如：固態電池）">
    <button id="start-btn">
      <i class="ti ti-player-play"></i> 開始媒體訓練
    </button>
  </div>

  <!-- 結算畫面。舊版只有一個平均分和一句「請參考各題的評分建議」，主管離開頁面就什麼都不剩。 -->
  <div id="end-screen">
    <div class="trophy">🎯</div>
    <h2>訓練完成！</h2>
    <p id="end-avg"></p>
    <div id="report-body"></div>
    <div class="end-actions">
      <button id="copy-report-btn" type="button"><i class="ti ti-copy"></i> 複製重點</button>
      <button id="download-report-btn" type="button"><i class="ti ti-download"></i> 下載完整紀錄</button>
    </div>
    <p id="copy-note"></p>
    <div class="end-actions">
      <button id="drill-btn" type="button"><i class="ti ti-target"></i> 最低分那題，再答一次</button>
      <button id="restart-btn" type="button"><i class="ti ti-refresh"></i> 再練一場</button>
    </div>
  </div>
</div>

<div id="input-area" class="voice" style="display:none">
  <!-- ① 語音作答（預設）：按一下開始講，再按一下停止 -->
  <div id="voice-pane">
    <div id="mic-row">
      <button id="mic-btn" type="button" disabled>
        <i class="ti ti-microphone"></i><span id="mic-label">按一下開始講</span>
      </button>
      <button id="switch-to-type" class="link-btn" type="button">改用打字</button>
    </div>
    <div id="rec-status" style="display:none">
      <div class="rec-row">
        <span id="rec-dot"></span>
        <span id="rec-time">0:00</span>
        <span id="rec-target">目標 0:30–1:00</span>
        <div id="level-track"><div id="level-fill"></div></div>
      </div>
      <div id="rec-hint">目標：1 分鐘內講完重點</div>
    </div>
    <div id="live-caption" style="display:none"></div>
    <div id="voice-note"></div>
  </div>

  <!-- ② 逐字稿確認：辨識一定會有錯字，送出前一定要讓主管自己改 -->
  <div id="confirm-pane" style="display:none">
    <div class="confirm-head"><i class="ti ti-ear"></i> <span id="confirm-head-text">聽到的是這樣，送出前可以直接改</span></div>
    <textarea id="transcript-box" rows="3"></textarea>
    <div class="confirm-actions">
      <button id="redo-btn" type="button"><i class="ti ti-refresh"></i> 重錄</button>
      <button id="confirm-send-btn" type="button"><i class="ti ti-send"></i> 送出作答</button>
    </div>
  </div>

  <!-- ③ 打字作答：永遠留著這條路。麥克風壞了、在開放空間不方便講、辨識一直失敗，
       都得有辦法把這場練完。 -->
  <div id="type-pane" style="display:none">
    <textarea id="user-input" rows="1" placeholder="輸入您的回答…（Enter 送出，Shift+Enter 換行）" disabled></textarea>
    <button id="send-btn" disabled><i class="ti ti-send"></i></button>
    <button id="switch-to-voice" class="link-btn" type="button">改用講的</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
let eventId = params.get('id');
// 這支功能只給內部人用：帶 ?code=（同仁該場的編輯碼）或已在後台登入過（sessionStorage 有密碼）才能用
const TRAINING_CODE = params.get('code') || '';
const TRAINING_PWD = sessionStorage.getItem('itri_pwd') || '';
let reporterHist = [];  // 記者對話歷程
let questionCount = 0;
// 這一場幾題。開始畫面讓主管選 3（快速）或 5（完整）——主管的時間是零碎的，
// 固定 5 題（約 10 分鐘）的門檻，會讓「再練一次」永遠排不進行程（批次 70 待辦第 1 項）。
const Q_OPTIONS = [
  { n: 3, label: '3 題・快速', hint: '約 6 分鐘' },
  { n: 5, label: '5 題・完整', hint: '約 10 分鐘' },
];
const Q_LS_KEY = 'itri_training_q_total';
let MAX_Q = 5;
// 「最低分那題，再答一次」：同一家媒體、同一題，只練這一題。不寫進演練紀錄
// （它是一場演練的延伸，不是新的一場——「演練場次」不該被它灌水）。
let isDrill = false;
let drillPrevScore = null;
let isWaiting = false;
let awaitingAnswer = false; // 等待使用者回答
let eventName = '工研院活動';

// 這場的每題分數，null 代表這題的評分文字沒解析出「整體分數：X / 10」（極少見，
// AI 格式漂移時才會發生）。只在真的走到終畫面（5 題全部答完）才會送去記錄——
// 中途離開的不算一場，見 startTraining()／submitAnswer() 裡的說明。
let sessionScores = [];

// 這一場畫面上出現過的每一則（記者題目 q／主管作答 a／訓練師評分 e），照順序記下來。
// 三個用途：終畫面的「帶得走」報告、複製／下載紀錄、重新整理之後接著練。
// ⚠️ 只在「新內容第一次出現」時記（見 addReporterMsg 等的 log 參數），接著練時
// 重畫舊內容不能再記一次，不然每重新整理一次，報告就多一份重複的題目。
let sessionLog = [];
let sessionStartedAt = 0;
// 送出了但還沒拿到結果的那一步：{ kind: 'eval', seconds, viaVoice } 或 { kind: 'question' }。
// 重新整理之後靠它知道要補哪一步——回答已經送出、評分還沒回來時，接著練要直接補評分，
// 不能叫主管把那一題重講一遍。
let pendingStep = null;

// ── 語音作答狀態 ─────────────────────────────────────────────────────
// 'voice' | 'type'。記在瀏覽器裡，下次進來維持上次的選擇——在開放空間不方便
// 講話的人，不該每一題都要重按一次「改用打字」。
const ANSWER_MODE_LS_KEY = 'itri_training_answer_mode';
let answerMode = 'voice';
let recording = false;
let mediaRecorder = null, mediaStream = null, audioCtx = null, analyser = null;
let recChunks = [], recStartedAt = 0, recTimer = null, levelRaf = null, autoStopTimer = null;
// 整段錄音看到的最大音量。麥克風被系統靜音時，MediaRecorder 一樣會乖乖產出一個
// 「有長度但整段是無聲」的檔案，不會報錯——只能自己量。
let peakLevel = 0;
let speechRec = null, liveFinal = '', liveInterim = '';
let abandonRecording = false; // 錄到一半改用打字／重新開始：停下來就好，不要跳確認畫面
// 「伺服器的語音辨識沒有啟用」這件事，整場只需要講一次。實測（主管的 iPhone）每一題
// 都跳同一段字，佔掉兩行、把「講了幾秒」整個擠掉——而那正是這場在練的東西。
let sttFallbackNoticed = false;
let pendingSeconds = 0;     // 待送出的這段講了幾秒
let voiceAnswerCount = 0;   // 這場有幾題是用講的（寫進演練紀錄）

// 每一題的目標長度：30 秒到 1 分鐘把重點講完。
// ⚠️ 這兩個數字要跟 api/training.js 的 TARGET_MIN_SEC／TARGET_MAX_SEC 一致——畫面上
// 催他收尾的秒數，跟評分時用的標準不是同一個，主管會看到自己「準時收尾卻被說超時」。
// test/training-voice.test.mjs 有一條在比對這件事（同 test/kb-limit.test.mjs 的做法）。
const TARGET_MIN_SEC = 30;
const TARGET_MAX_SEC = 60;
const TOO_LONG_SEC = 90;

const MAX_REC_SECONDS = 150;   // 硬上限 2 分半：再長音檔會逼近 Vercel 的請求上限。
                               // 刻意留在目標值之上——讓講太久的人真的體驗到「太久」，
                               // 而不是一到 60 秒就被切掉、練不到自己收尾
const SILENT_PEAK = 0.02;      // 低於這個音量＝這段大概沒收到人聲

// ── 今天受訪的是誰 ───────────────────────────────────────────────────
// 同一場記者會，院長被問的跟計畫主持人被問的不是同一批問題：院長要答資源配置
// 與政策，計畫主持人要答技術做不到什麼。舊版不分身分，出來的題目對誰都只有七分準。
//
// ⚠️ 這份清單要跟 lib/training-persona.js 的 TRAINEE_ROLES 一模一樣（id 與 label）。
// 這裡是畫面用的副本，真正決定題目的是後端那一份；兩邊對不起來的話，主管會選了
// 一個身分、卻拿到通用題目，而且畫面上完全看不出哪裡不對。
// test/training.test.mjs 有一條在比對兩份清單（同 TARGET_MIN_SEC 的做法）。
const ROLES = [
  { id: 'exec',      label: '院長／副院長',          hint: '全院策略、資源、對外代表' },
  { id: 'director',  label: '所長／中心主任',        hint: '單一領域的技術路線與團隊' },
  { id: 'pi',        label: '計畫主持人／技術負責人', hint: '單一技術或計畫的第一線負責人' },
  { id: 'bd',        label: '產業服務／推廣單位主管', hint: '對接廠商、技轉與合作' },
  { id: 'other',     label: '其他／不特別指定',      hint: '用通用的受訪主管題目' },
];
const ROLE_LS_KEY = 'itri_trainee_role';
let traineeRole = 'other';
// 這場專訪是哪一家媒體。第一題由後端隨機挑一家真的存在的台灣媒體並回傳，
// 之後幾題把同一個 id 帶回去——不帶的話每一題都會換一家，五題變成五個不同的記者
// 輪流上來，練不到「被同一個記者追著打」。
let sessionOutlet = null;

// 受訓者姓名/職稱記在瀏覽器裡，下次直接帶出來——跟 event.html 記住記者媒體名稱
// 同一招。純粹方便，不是必填；localStorage 讀不到就當作沒填過，不影響流程。
const TRAINEE_LS_KEY = 'itri_trainee_name';
const FOCUS_LS_KEY = 'itri_trainee_focus';
function rememberedTrainee() {
  try { return localStorage.getItem(TRAINEE_LS_KEY) || ''; } catch (e) { return ''; }
}
function rememberTrainee(v) {
  try { if (v) localStorage.setItem(TRAINEE_LS_KEY, v); } catch (e) { /* 存不了就算了 */ }
}
const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 存不了就算了 */ } };

function renderRolePicker() {
  document.getElementById('role-picker').innerHTML = ROLES.map((r, i) =>
    `<button type="button" class="role-chip${r.id === traineeRole ? ' on' : ''}" data-i="${i}">`
    + `<b>${escHtml(r.label)}</b><span>${escHtml(r.hint)}</span></button>`).join('');
}
function pickRole(i) {
  const r = ROLES[i];
  if (!r) return;
  traineeRole = r.id;
  lsSet(ROLE_LS_KEY, r.id);
  renderRolePicker();
}

/** 今天由哪一家媒體來訪。真實的媒體訓練，第一件事就是告訴受訓者今天誰來。 */
function showOutletBanner(outlet) {
  if (!outlet || !outlet.name) return;
  const el = document.getElementById('outlet-banner');
  el.innerHTML = `<b>今天來訪的是《${escHtml(outlet.name)}》的記者。</b>`
    + (outlet.beat ? `<br>${escHtml(outlet.beat)}` : '')
    + `<span class="sim">本場為媒體訓練模擬，非該媒體實際採訪。每次演練會換一家，題目也會跟著換。</span>`;
  el.style.display = 'block';
}

// ── 題數 ─────────────────────────────────────────────────────────────
function renderQPicker() {
  document.getElementById('qcount-picker').innerHTML = Q_OPTIONS.map((o) =>
    `<button type="button" class="q-chip${o.n === MAX_Q ? ' on' : ''}" data-n="${o.n}">`
    + `<b>${escHtml(o.label)}</b><span>${escHtml(o.hint)}</span></button>`).join('');
  updateProgress();
}
function pickQ(n) {
  if (!Q_OPTIONS.some((o) => o.n === n)) return;
  MAX_Q = n;
  lsSet(Q_LS_KEY, String(n));
  renderQPicker();
}

// ── 練到一半中斷，回來接著練（批次 72）─────────────────────────────────
// iPhone 上這件事比想像中常發生：麥克風權限被擋 → 照提示去「設定」打開 → 回到 Safari
// 時分頁被重新載入；練到一半來電；手滑按到「回後台」。舊版全部等於從第一題重來，
// 而批次 70 才剛修掉「網路抖一下就毀掉整場」——重新整理是同一種傷害，只是換了個入口。
//
// 存在 sessionStorage（不是 localStorage）：關掉分頁就該結束，只有「同一個分頁重新
// 載入」才接得回來。存不了（無痕模式、容量滿）就算了，行為跟改之前一模一樣。
const SESSION_SS_PREFIX = 'itri_training_session:';
const sessionKey = () => SESSION_SS_PREFIX + (eventId || '');
function saveSession() {
  if (isDrill) return;   // 單題重練不值得接著練，也不要蓋掉剛結束那場的狀態
  try {
    sessionStorage.setItem(sessionKey(), JSON.stringify({
      v: 1, eventId, total: MAX_Q, questionCount, reporterHist, sessionScores,
      voiceAnswerCount, sessionOutlet, role: traineeRole, log: sessionLog,
      pending: pendingStep, startedAt: sessionStartedAt, savedAt: Date.now(),
    }));
  } catch (e) { /* 存不了就算了 */ }
}
function clearSavedSession() {
  try { sessionStorage.removeItem(sessionKey()); } catch (e) {}
}
function loadSavedSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(sessionKey()) || 'null');
    if (!s || s.v !== 1 || s.eventId !== eventId) return null;
    if (!Array.isArray(s.reporterHist) || !Array.isArray(s.log) || !s.log.length) return null;
    if (Date.now() - (s.savedAt || 0) > 6 * 60 * 60 * 1000) return null;  // 半天前的就不要了
    return s;
  } catch (e) { return null; }
}
function offerResume() {
  const s = loadSavedSession();
  if (!s) return;
  const answered = s.log.filter((x) => x.k === 'e').length;
  document.getElementById('resume-text').innerHTML =
    `<b>剛才那場還沒練完</b>（${escHtml(String(answered))} / ${escHtml(String(s.total))} 題已評分`
    + `${s.sessionOutlet && s.sessionOutlet.name ? `，《${escHtml(s.sessionOutlet.name)}》來訪` : ''}）。`
    + '<br>可能是重新整理、切去設定開麥克風，或來了一通電話——進度都還在。';
  document.getElementById('resume-box').style.display = 'block';
}
function restoreSession(s) {
  document.getElementById('resume-box').style.display = 'none';
  MAX_Q = s.total || 5;
  questionCount = s.questionCount || 0;
  reporterHist = s.reporterHist || [];
  sessionScores = s.sessionScores || [];
  voiceAnswerCount = s.voiceAnswerCount || 0;
  sessionOutlet = s.sessionOutlet || null;
  if (ROLES.some((r) => r.id === s.role)) traineeRole = s.role;
  sessionLog = s.log || [];
  sessionStartedAt = s.startedAt || Date.now();
  pendingStep = s.pending || null;
  isDrill = false;

  enterTrainingLayout();
  if (sessionOutlet) showOutletBanner(sessionOutlet);
  for (const entry of sessionLog) renderEntry(entry);
  updateProgress();

  // 斷在哪一步，就從哪一步接：評分還沒回來 → 補評分；下一題還沒出來 → 補出題；
  // 否則就是在等他回答。
  if (pendingStep && pendingStep.kind === 'eval') {
    const p = pendingStep;
    showRetry('剛才送出的回答還沒評分完成，按下面接著評分（不用重講）。', () => evaluateAnswer(p.seconds, p.viaVoice));
  } else if (pendingStep && pendingStep.kind === 'question') {
    showRetry('下一題還沒出來，按下面接著走。', askNextQuestion);
  } else if (!reporterHist.length || reporterHist[reporterHist.length - 1].role !== 'assistant') {
    showRetry('按下面接著出題。', askNextQuestion);
  } else {
    enableAnswering();
  }
}

// ── 上次練習（存在這台裝置上）───────────────────────────────────────────
// training_log 在後端存了，但主管自己看不到（批次 70 待辦第 3 項）。這裡只記在瀏覽器：
// 不用登入、不多打一次 Sheets，要的只是「上次卡在哪、這次有沒有進步」這一眼。
const HISTORY_LS_KEY = 'itri_training_history';
function loadHistory() {
  try { const h = JSON.parse(localStorage.getItem(HISTORY_LS_KEY) || '[]'); return Array.isArray(h) ? h : []; }
  catch (e) { return []; }
}
function rememberHistory(item) {
  const h = loadHistory();
  h.push(item);
  try { localStorage.setItem(HISTORY_LS_KEY, JSON.stringify(h.slice(-10))); } catch (e) {}
}
function renderLastSession() {
  const h = loadHistory().filter((x) => x && x.eventId === eventId && x.avg != null);
  const el = document.getElementById('last-session');
  if (!h.length) { el.style.display = 'none'; return; }
  const last = h[h.length - 1];
  const d = new Date(last.at || 0);
  const when = isNaN(d.getTime()) ? '' : `${d.getMonth() + 1}/${d.getDate()}`;
  const trend = h.length >= 2 ? `<br>最近 ${Math.min(h.length, 3)} 次平均：${h.slice(-3).map((x) => escHtml(String(x.avg))).join(' → ')}` : '';
  el.innerHTML = `<b>上次練習</b>（${escHtml(when)}${last.outlet ? `・${escHtml(last.outlet)}` : ''}・${escHtml(String(last.total))} 題）平均 <b>${escHtml(String(last.avg))}</b> 分`
    + (last.fix ? `<br>上次最該改的：${escHtml(last.fix)}` : '') + trend;
  el.style.display = 'block';
}

// ── 結算報告：帶得走的重點（批次 72）─────────────────────────────────────
// 批次 70 待辦第 2 項：「終畫面只有平均分和一句『請參考各題的評分建議』，主管離開頁面
// 就什麼都不剩」。媒體訓練真正的產出不是分數，是「下次上台前要記得的三件事」和「一句
// 可以直接拿去用的話」——這兩樣都已經在每一題的評語裡了，只是散在五個泡泡裡沒人整理。
//
// ⚠️ 刻意不再多打一次模型做「總評」：評語是訓練師看著逐字稿寫的，這裡只做整理——
// 從評語裡挑、排序、去重，不生成任何新的說法。多一次呼叫就多一個會失敗、會等的地方，
// 而且總評寫出評語裡沒有的東西時，主管分不出哪一句是真的根據他的回答。

/** 評語裡「標題：」後面那一段的第一條（「• 」「・」「- 」開頭的項目）。 */
function firstBulletAfter(text, head) {
  const lines = String(text || '').split('\n');
  const i = lines.findIndex((l) => l.trim().startsWith(head));
  if (i < 0) return '';
  for (let j = i + 1; j < lines.length; j++) {
    const t = lines[j].trim();
    if (!t) continue;
    const m = t.match(/^[•・\-*＊●]\s*(.+)$/);
    return m ? m[1].trim() : '';
  }
  return '';
}
/** 「可直接引用的一句：」下一行（或同一行冒號後）的內容；佔位說明、找不到的聲明一律當沒有。 */
function quoteAfter(text) {
  const m = String(text || '').match(/可直接引用的一句[：:][ \t]*\n?[ \t]*([^\n]+)/);
  if (!m) return '';
  const q = m[1].trim().replace(/^[「『"]+|[」』"]+$/g, '').trim();
  if (!q || /^[（(]/.test(q) || /沒有能單獨引用|40 ?字以內/.test(q)) return '';
  return q;
}

/** 把 sessionLog 整理成「一題一列」。 */
function collectRounds() {
  const rounds = [];
  let cur = null;
  for (const e of sessionLog) {
    if (e.k === 'q') { cur = { q: e.text, a: '', sec: 0, voice: false, evalText: '', score: null }; rounds.push(cur); }
    else if (e.k === 'a' && cur) { cur.a = e.text; cur.sec = e.sec || 0; cur.voice = !!e.voice; }
    else if (e.k === 'e' && cur) { cur.evalText = e.text; cur.score = e.score; }
  }
  return rounds.filter((r) => r.evalText);
}

function buildReport() {
  const rounds = collectRounds();
  const scores = rounds.map((r) => r.score).filter((s) => s != null);
  const avg = scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10 : null;
  // 最該改的三件事：從分數最低的題目開始，取各題「改進建議」的第一條，去重後取三條。
  // 第一條是訓練師認為最重要的那一條（語音場次的 prompt 甚至規定超時要寫在第一條）。
  const byLow = [...rounds].sort((a, b) => (a.score ?? 99) - (b.score ?? 99));
  const fixes = [];
  for (const r of byLow) {
    const f = firstBulletAfter(r.evalText, '改進建議');
    if (f && !fixes.includes(f)) fixes.push(f);
    if (fixes.length >= 3) break;
  }
  // 最好的一句：分數最高那題的「可直接引用的一句」
  const withQuote = rounds.filter((r) => quoteAfter(r.evalText));
  const best = withQuote.sort((a, b) => (b.score ?? -1) - (a.score ?? -1))[0];
  const low = byLow.find((r) => r.score != null) || null;
  return { rounds, avg, fixes, bestQuote: best ? quoteAfter(best.evalText) : '', low };
}

function shortQ(q) {
  const s = String(q || '').replace(/\s+/g, ' ').trim();
  return s.length > 60 ? s.slice(0, 60) + '…' : s;
}

function renderReport() {
  const rep = buildReport();
  const body = document.getElementById('report-body');
  const parts = [];
  if (isDrill && drillPrevScore != null && rep.rounds[0] && rep.rounds[0].score != null) {
    const now = rep.rounds[0].score;
    const diff = Math.round((now - drillPrevScore) * 10) / 10;
    parts.push(`<h3>這一題：${escHtml(String(drillPrevScore))} → ${escHtml(String(now))} 分</h3>`
      + `<p>${diff > 0 ? `進步了 ${escHtml(String(diff))} 分 👍` : diff === 0 ? '跟上次一樣，對照下面的建議再調一次看看。' : '這次比上次低，對照下面的建議再調一次看看。'}</p>`);
  }
  if (rep.fixes.length) {
    parts.push(`<h3>最該改的${['', '一', '兩', '三'][rep.fixes.length]}件事</h3><ol>` + rep.fixes.map((f) => `<li>${escHtml(f)}</li>`).join('') + '</ol>');
  }
  if (rep.bestQuote) {
    parts.push(`<h3>可以直接拿去用的一句</h3><blockquote>「${escHtml(rep.bestQuote)}」</blockquote>`);
  }
  if (rep.rounds.length > 1) {
    parts.push('<h3>各題分數</h3>' + rep.rounds.map((r, i) =>
      `<div class="q-row"><span class="q-score${r.score != null && r.score < 6 ? ' low' : ''}">${r.score != null ? escHtml(String(r.score)) : '—'}</span>`
      + `<span class="q-text">${escHtml(shortQ(r.q))}<br><span class="q-meta">第 ${i + 1} 題${r.voice && r.sec ? `・用講的 ${fmtTime(r.sec)}${r.sec > TARGET_MAX_SEC ? '（超時）' : ''}` : ''}</span></span></div>`).join(''));
  }
  body.innerHTML = parts.join('') || '<p>請參考各題的評分建議，調整您的發言策略。</p>';
  document.getElementById('end-avg').textContent = rep.avg != null
    ? `${isDrill ? '這一題' : '本次平均分'}：${rep.avg} / 10${!isDrill && voiceAnswerCount ? `（${voiceAnswerCount} / ${rep.rounds.length} 題用講的）` : ''}`
    : '';
  // 至少答了兩題、而且真的有分數，「再答一次」才有意義；單題重練完就不再疊一層
  document.getElementById('drill-btn').style.display = (!isDrill && rep.low && rep.rounds.length > 1) ? '' : 'none';
  document.getElementById('copy-note').textContent = '';
  return rep;
}

/** 給人貼到 LINE／Email 的純文字版重點（不是完整紀錄）。 */
function reportText(full) {
  const rep = buildReport();
  const d = new Date(sessionStartedAt || Date.now());
  const head = [
    `【媒體訓練紀錄】${eventName}`,
    `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`
      + `${sessionOutlet && sessionOutlet.name ? `｜《${sessionOutlet.name}》來訪（模擬）` : ''}`
      + `｜${rep.rounds.length} 題${rep.avg != null ? `｜平均 ${rep.avg} 分` : ''}`,
  ];
  const trainee = document.getElementById('trainee-input').value.trim();
  if (trainee) head.push(`受訓者：${trainee}`);
  const out = [head.join('\n')];
  if (rep.fixes.length) out.push(`最該改的${['', '一', '兩', '三'][rep.fixes.length]}件事\n` + rep.fixes.map((f, i) => `${i + 1}. ${f}`).join('\n'));
  if (rep.bestQuote) out.push(`可以直接拿去用的一句\n「${rep.bestQuote}」`);
  out.push('各題\n' + rep.rounds.map((r, i) =>
    `第 ${i + 1} 題（${r.score != null ? r.score + ' 分' : '未評分'}${r.voice && r.sec ? `，講了 ${fmtTime(r.sec)}` : ''}）${shortQ(r.q)}`
    + (full ? `\n\n【記者】${r.q}\n\n【我的回答】${r.a}\n\n【訓練師】\n${r.evalText}` : '')).join(full ? '\n\n──────────\n\n' : '\n'));
  return out.join('\n\n');
}

async function copyReport() {
  const text = reportText(false);
  const note = document.getElementById('copy-note');
  try {
    await navigator.clipboard.writeText(text);
    note.textContent = '已複製，可以直接貼到 LINE 或 Email。';
  } catch (e) {
    // 舊版 iOS／非 HTTPS 沒有 clipboard API：退回傳統的選取＋複製
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.fontSize = '16px';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    note.textContent = ok ? '已複製，可以直接貼到 LINE 或 Email。' : '這個瀏覽器不讓網頁複製，請改按「下載完整紀錄」。';
  }
}

function downloadReport() {
  const blob = new Blob(['﻿' + reportText(true)], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  const d = new Date(sessionStartedAt || Date.now());
  a.href = URL.createObjectURL(blob);
  a.download = `媒體訓練紀錄_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function init() {
  // 返回連結：同仁是拿編輯連結（?code=）進來的，沒有後台密碼——舊版一律連到 /，
  // 同仁按了只會看到一個登入畫面。有編輯碼就回這場的編輯頁。
  const back = document.getElementById('back-link');
  if (TRAINING_CODE && eventId && eventId !== 'all') {
    back.href = `/edit?id=${encodeURIComponent(eventId)}&code=${encodeURIComponent(TRAINING_CODE)}`;
    document.getElementById('back-label').textContent = '回編輯頁';
  } else {
    back.href = '/';
  }
  // 練到一半按「回…」會丟掉進度——至少問一聲（進度其實也存在分頁裡，見 saveSession）
  back.addEventListener('click', (e) => {
    if (reporterHist.length && !document.body.classList.contains('finished') && !confirm('演練還沒結束，確定要離開嗎？')) e.preventDefault();
  });

  const savedQ = Number(lsGet(Q_LS_KEY));
  if (Q_OPTIONS.some((o) => o.n === savedQ)) MAX_Q = savedQ;
  renderQPicker();
  document.getElementById('qcount-picker').addEventListener('click', (e) => {
    const chip = e.target.closest('.q-chip');
    if (chip) pickQ(Number(chip.dataset.n));
  });

  // 作答方式：沿用上次的選擇；這台機器根本錄不了音就直接退回打字，不要讓人
  // 按了麥克風才發現不能用。
  let saved = 'voice';
  try { saved = localStorage.getItem(ANSWER_MODE_LS_KEY) || 'voice'; } catch (e) {}
  if (!canRecord()) {
    setAnswerMode('type', false);
    setVoiceNote('這個瀏覽器（或非 HTTPS 連線）不支援錄音，已改用打字。', true);
  } else {
    setAnswerMode(saved, false);
  }

  const prevTrainee = rememberedTrainee();
  if (prevTrainee) document.getElementById('trainee-input').value = prevTrainee;
  const prevFocus = lsGet(FOCUS_LS_KEY);
  if (prevFocus) document.getElementById('focus-input').value = prevFocus;
  const prevRole = lsGet(ROLE_LS_KEY);
  if (ROLES.some((r) => r.id === prevRole)) traineeRole = prevRole;
  renderRolePicker();
  // 委派：身分按鈕是動態畫出來的，綁在容器上才不用每次重畫都重綁
  document.getElementById('role-picker').addEventListener('click', (e) => {
    const chip = e.target.closest('.role-chip');
    if (chip) pickRole(Number(chip.dataset.i));
  });

  if (!TRAINING_CODE && !TRAINING_PWD) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('info-card').innerHTML =
      '<i class="ti ti-lock"></i><span>這個功能只給內部同仁使用。請先從後台登入，再從活動卡片點「媒體訓練」進入本頁。</span>';
    document.getElementById('progress-bar').style.display = 'none';
    document.getElementById('start-area').style.display = 'none';
    return;
  }

  try {
    const events = await loadTrainingEvents();

    if (!eventId) {
      // 沒有指定活動 → 顯示選擇器
      document.getElementById('event-title').textContent = '媒體訓練模式';
      document.getElementById('loading').style.display = 'none';
      showEventSelector(events);
      return;
    }

    if (eventId === 'all') {
      eventName = '工研院彙整媒體訓練';
      document.getElementById('event-title').textContent = '彙整媒體訓練 — 全部活動';
      document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練（綜合所有活動）';
      document.title = '彙整媒體訓練';
    } else {
      const event = events.find(e => e.id === eventId) || await loadOneEvent(eventId);
      if (event) {
        eventName = event.name;
        document.getElementById('event-title').textContent = event.name + ' — 媒體訓練';
        document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練';
        document.title = event.name + ' — 媒體訓練';
      }
    }
  } catch(e) {}

  document.getElementById('loading').style.display = 'none';
  renderLastSession();
  offerResume();
}

// 活動清單（批次 82）。以前一律打公開列表 /api/events——那支刻意不含「未發布」的場次，
// 而主管最常練的正是還沒發布、下週才要開記者會的那一場：頁首只剩「媒體訓練模式」、
// 帶走的報告寫「工研院活動」，後台選擇器裡也找不到那一場。
// 後台登入的人改拿後台列表（含未發布，不含已封存）；拿同仁編輯碼進來的只會練自己那一場，
// 名稱由 loadOneEvent() 用同一組編輯碼去讀。
async function loadTrainingEvents() {
  if (TRAINING_PWD) {
    try {
      const r = await fetch('/api/events?action=list_admin', { headers: { 'X-Admin-Password': TRAINING_PWD } });
      if (r.ok) {
        const d = await r.json();
        return (d.events || []).filter(e => e.status !== 'archived');
      }
    } catch (e) { /* 退回公開列表 */ }
  }
  const r = await fetch('/api/events');
  const d = await r.json();
  return d.events || [];
}
async function loadOneEvent(id) {
  if (!TRAINING_CODE || !id || id === 'all') return null;
  try {
    const r = await fetch(`/api/events?action=get_edit&id=${encodeURIComponent(id)}&code=${encodeURIComponent(TRAINING_CODE)}`);
    if (!r.ok) return null;
    const d = await r.json();
    return d && d.name ? { id: d.id, name: d.name } : null;
  } catch (e) { return null; }
}

function showEventSelector(events) {
  // 隱藏進度條與開始按鈕，顯示選擇器
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('start-area').style.display = 'none';

  const container = document.createElement('div');
  container.id = 'event-selector';
  container.style.cssText = 'padding:20px 16px;';

  const title = document.createElement('p');
  title.style.cssText = 'font-size:0.9rem;color:#7c3a0a;margin-bottom:14px;font-weight:600;';
  title.textContent = '請選擇要進行訓練的活動：';
  container.appendChild(title);

  // 彙整選項
  const allBtn = createSelectorBtn('🗂 彙整訓練（全部活動）', 'all', '涵蓋所有進行中活動的知識庫');
  container.appendChild(allBtn);

  // 各活動選項
  events.forEach(ev => {
    const btn = createSelectorBtn('📋 ' + ev.name, ev.id, '');
    container.appendChild(btn);
  });

  // 插入在 info-card 之後
  document.getElementById('info-card').insertAdjacentElement('afterend', container);
}

function createSelectorBtn(label, id, desc) {
  const btn = document.createElement('button');
  btn.style.cssText = 'display:block;width:100%;text-align:left;background:white;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin-bottom:10px;cursor:pointer;font-family:var(--font);font-size:0.9rem;font-weight:600;transition:all 0.15s;';
  btn.textContent = label;
  if (desc) {
    const sub = document.createElement('div');
    sub.style.cssText = 'font-size:0.76rem;font-weight:400;color:#6b7280;margin-top:3px;';
    sub.textContent = desc;
    btn.appendChild(sub);
  }
  btn.onmouseover = () => { btn.style.borderColor = 'var(--primary)'; btn.style.background = 'var(--primary-light)'; };
  btn.onmouseout = () => { btn.style.borderColor = '#e5e7eb'; btn.style.background = 'white'; };
  btn.onclick = () => {
    // 報告與下載檔要寫得出活動名稱——選擇器進來的，init() 那時還不知道是哪一場
    if (id !== 'all') eventName = label.replace(/^📋\s*/, '');
    selectEvent(id);
  };
  return btn;
}

function selectEvent(id) {
  eventId = id;
  // 更新 URL（不重新整理）
  history.replaceState(null, '', '/training?id=' + encodeURIComponent(id));
  // 移除選擇器，顯示進度條＋開始。
  // ⚠️ 用 id 找，不要用「info-card 的下一個兄弟」——那一格在批次 72 之後是媒體橫幅，
  // 找錯人會把橫幅整個刪掉。
  document.getElementById('event-selector')?.remove();
  document.getElementById('progress-bar').style.display = '';
  document.getElementById('start-area').style.display = 'flex';

  if (id === 'all') {
    eventName = '工研院彙整媒體訓練';
    document.getElementById('event-title').textContent = '彙整媒體訓練 — 全部活動';
    document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練（綜合所有活動）';
  }
  renderLastSession();
  offerResume();
}

/** 把一場演練的所有狀態歸零（開始新的一場、再練一場、單題重練都先過這裡）。 */
function resetSessionState() {
  reporterHist = [];
  questionCount = 0;
  sessionScores = [];
  voiceAnswerCount = 0;
  sttFallbackNoticed = false;
  sessionLog = [];
  pendingStep = null;
  isWaiting = false;
  awaitingAnswer = false;
  if (recording) stopRecording(true); else cleanupRecording();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('end-avg').textContent = '';
  document.getElementById('report-body').innerHTML = '';
  document.getElementById('end-screen').style.display = 'none';
  document.body.classList.remove('finished');
}

/** 開始作答的版面：開始區收起、說明卡收起（見 body.started）、作答區打開。 */
function enterTrainingLayout() {
  document.body.classList.add('started');
  document.getElementById('start-area').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('input-area').style.display = 'flex';
  document.getElementById('scroller').scrollTop = 0;
}

document.getElementById('restart-btn').addEventListener('click', () => {
  resetSessionState();
  isDrill = false;
  sessionOutlet = null;   // 下一場換一家媒體來訪，題目才不會每次都一樣
  document.getElementById('outlet-banner').style.display = 'none';
  document.body.classList.remove('started');
  document.getElementById('input-area').style.display = 'none';
  document.getElementById('start-area').style.display = 'flex';
  // 單題重練把 MAX_Q 設成 1 過；回到開始畫面時一律回到他選的題數
  const q = Number(lsGet(Q_LS_KEY));
  MAX_Q = Q_OPTIONS.some((o) => o.n === q) ? q : 5;
  renderQPicker();
  renderLastSession();
  updateProgress();
  document.getElementById('scroller').scrollTop = 0;
});

async function startTraining() {
  clearSavedSession();    // 按了「開始」就是不要接上次那場了
  document.getElementById('resume-box').style.display = 'none';
  resetSessionState();
  isDrill = false;
  sessionOutlet = null;   // 每一場重新抽一家媒體，不然練第二次還是同一家
  sessionStartedAt = Date.now();
  rememberTrainee(document.getElementById('trainee-input').value.trim());
  lsSet(FOCUS_LS_KEY, document.getElementById('focus-input').value.trim());
  enterTrainingLayout();
  updateProgress();
  await askNextQuestion();
}

/**
 * 「最低分那題，再答一次」。真實的媒體訓練最常做的一件事就是「這題再來一次」——
 * 看完建議馬上重答，比下次整場重練有效得多。同一家媒體、同一題，只練這一題；
 * 題目直接用剛才那一題的原文，不重新出題（重新出的就不是同一題了）。
 */
function startDrill() {
  const { low } = buildReport();
  if (!low) return;
  resetSessionState();
  isDrill = true;
  drillPrevScore = low.score;
  MAX_Q = 1;
  sessionStartedAt = Date.now();
  enterTrainingLayout();
  if (sessionOutlet) showOutletBanner(sessionOutlet);
  addSystemMsg(`再答一次：上次這題 ${low.score} 分。先看一下剛才的建議，再開始。`);
  reporterHist.push({ role: 'assistant', content: low.q });
  addReporterMsg(low.q, { log: true });
  questionCount = 1;
  updateProgress();
  enableAnswering();
}
document.getElementById('drill-btn').addEventListener('click', startDrill);
document.getElementById('copy-report-btn').addEventListener('click', copyReport);
document.getElementById('download-report-btn').addEventListener('click', downloadReport);
document.getElementById('resume-btn').addEventListener('click', () => {
  const s = loadSavedSession();
  if (s) restoreSession(s); else document.getElementById('resume-box').style.display = 'none';
});
document.getElementById('discard-btn').addEventListener('click', () => {
  clearSavedSession();
  document.getElementById('resume-box').style.display = 'none';
});

/** 最後一題評完：顯示帶得走的報告、記錄這一場。 */
function finishTraining() {
  document.body.classList.add('finished');
  document.getElementById('input-area').style.display = 'none';
  const rep = renderReport();
  const end = document.getElementById('end-screen');
  end.style.display = 'block';
  updateProgress();
  setTimeout(() => end.scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
  clearSavedSession();
  if (isDrill) { MAX_Q = Number(lsGet(Q_LS_KEY)) || 5; return; }   // 單題重練不記成一場
  rememberHistory({
    at: Date.now(), eventId, total: rep.rounds.length, avg: rep.avg,
    outlet: sessionOutlet && sessionOutlet.name ? sessionOutlet.name : '', fix: rep.fixes[0] || '',
  });
  logSession();
}

/** 每次呼叫 /api/training 都要帶的身分資料。集中一處，免得哪一支漏帶。 */
function personaPayload() {
  return {
    role: traineeRole,
    trainee: document.getElementById('trainee-input').value.trim(),
    focus: document.getElementById('focus-input').value.trim(),
    outlet: sessionOutlet ? sessionOutlet.id : undefined,
    total: MAX_Q,   // 記者要知道這場只有幾題，題數少時才會直接挑最關鍵的角度問
  };
}

/** 後端回來的媒體資料：記下來，之後幾題帶同一家，並且顯示給主管看。 */
function adoptOutlet(data) {
  if (data && data.outlet && data.outlet.name && !sessionOutlet) {
    sessionOutlet = data.outlet;
    showOutletBanner(sessionOutlet);
  }
}

/**
 * 連線或伺服器出問題時的收尾。
 *
 * ⚠️ 舊版這裡只印一句「請重新整理後再試」就結束，答題介面仍然是鎖住的——
 * 主管講了三題，網路抖一下，整場就沒了，而且畫面上唯一的出路是重新整理
 * （重新整理＝從第一題開始）。一次網路中斷不該毀掉整場演練，所以給一顆重試鍵，
 * 對話歷程還在記憶體裡，按下去就從剛才那一步接著走。
 */
function showRetry(text, onRetry) {
  const el = document.createElement('div');
  el.style.cssText = 'text-align:center;color:#9ca3af;font-size:0.82rem;padding:8px';
  el.textContent = text;
  const btn = document.createElement('button');
  btn.className = 'retry-btn';
  btn.innerHTML = '<i class="ti ti-refresh"></i> 再試一次';
  btn.addEventListener('click', () => { el.remove(); onRetry(); });
  el.appendChild(document.createElement('br'));
  el.appendChild(btn);
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function askNextQuestion() {
  isWaiting = true;
  awaitingAnswer = false;
  lockAnswering();
  pendingStep = { kind: 'question' };
  saveSession();

  showTyping('reporter');

  try {
    const res = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: reporterHist,
        event_id: eventId,
        mode: 'reporter',
        spoken: answerMode === 'voice',
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined,
        ...personaPayload()
      })
    });
    const data = await res.json().catch(() => ({}));
    removeTyping();

    // ⚠️ HTTP 狀態要看，錯誤訊息**絕對不能**當成記者的問題。
    // 舊版寫成 `data.reply || data.error`，於是「密碼錯誤」「ANTHROPIC_API_KEY 未設定」
    // 會以 AI 記者的口吻出現在畫面上，還被 push 進 reporterHist——之後每一題都帶著
    // 這句錯誤當上下文，整場演練從那一刻起就歪了，而且看起來完全正常。
    if (!res.ok || !data.reply) {
      isWaiting = false;
      showRetry(data.error || '沒有取得問題，可能是連線或伺服器忙碌。', askNextQuestion);
      return;
    }

    adoptOutlet(data);
    reporterHist.push({ role: 'assistant', content: data.reply });
    addReporterMsg(data.reply, { log: true });

    questionCount++;
    updateProgress();
    pendingStep = null;
    saveSession();

    enableAnswering();
  } catch(e) {
    removeTyping();
    isWaiting = false;
    showRetry('連線中斷了。您剛才的進度還在，按下面重試就接著走。', askNextQuestion);
    return;
  }

  isWaiting = false;
}

/**
 * 送出一題的回答。
 * @param {string} [rawText] 回答內容；省略就從打字框拿（打字模式）
 * @param {number} [seconds] 用講的時候，這段講了幾秒——評分要用
 * @param {boolean} [viaVoice] 這題是不是用講的
 */
async function submitAnswer(rawText, seconds = 0, viaVoice = false) {
  if (isWaiting || !awaitingAnswer) return;
  const typeBox = document.getElementById('user-input');
  // ⚠️ 只收字串。批次 66 起送出鍵綁的是 `addEventListener('click', submitAnswer)`，
  // 點擊事件物件被當成 rawText 傳進來，`String(event)` 是「[object PointerEvent]」——
  // 主管打好的回答被清掉，畫面與送去評分的都變成那串字（批次 72 實測重現）。
  // 按 Enter 走的是 submitAnswer() 不帶參數，所以桌機測不出來，偏偏手機上多半是按鍵。
  // 綁定那裡也改了，這裡再擋一次：不是字串就一律當成「從打字框拿」。
  const ans = String(typeof rawText === 'string' ? rawText : typeBox.value).trim();
  if (!ans) return;

  typeBox.value = '';
  typeBox.style.height = 'auto';
  lockAnswering();
  awaitingAnswer = false;
  isWaiting = true;
  if (viaVoice) voiceAnswerCount++;

  addUserMsg(ans, viaVoice ? seconds : 0, { log: true, voice: viaVoice });
  reporterHist.push({ role: 'user', content: ans });
  pendingStep = { kind: 'eval', seconds, viaVoice };
  saveSession();

  await evaluateAnswer(seconds, viaVoice);
}

/**
 * 評分這一題，並接上下一題。
 *
 * 從 submitAnswer() 拆出來是為了「可以重試」：評分失敗時，回答已經在 reporterHist
 * 裡了，重試只要再送一次評分就好，不必叫主管重講一遍。
 * voiceAnswerCount 在 submitAnswer() 裡就加過，所以重試不會重複計數。
 */
async function evaluateAnswer(seconds, viaVoice) {
  isWaiting = true;
  showTyping('eval');

  try {
    const evalRes = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: reporterHist,
        event_id: eventId,
        mode: 'evaluate',
        spoken: viaVoice,
        duration: viaVoice ? seconds : undefined,
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined,
        ...personaPayload()
      })
    });
    const evalData = await evalRes.json().catch(() => ({}));
    removeTyping();

    // 跟 askNextQuestion() 同一個道理：錯誤訊息不能當成評分顯示，更不能推進
    // 對話歷程。這裡還多一層——被當成「訓練師的話」推進去之後，後面的評分會
    // 開始針對那句錯誤訊息講評。
    if (!evalRes.ok || !evalData.reply) {
      isWaiting = false;
      showRetry(evalData.error || '沒有取得評分，可能是連線或伺服器忙碌。您剛才的回答還在。',
        () => evaluateAnswer(seconds, viaVoice));
      return;
    }

    adoptOutlet(evalData);
    const evalText = evalData.reply;
    reporterHist.push({ role: 'assistant', content: evalText });

    // 解析評分中的下一題（分隔線後的內容）。
    // 模型偶爾會把分隔線寫成簡體「---下一题---」或改成全形破折號，寬鬆一點比較保險：
    // 同一行、前後至少兩個破折號、中間含「下一」就算數。
    const parts = evalText.split(/[-—–─]{2,}[^\n]*下一[^\n]*[-—–─]{2,}/);
    const evalPart = parts[0].trim();
    const nextQ = parts[1]?.trim();

    // 抓「整體分數：X / 10」——prompt 裡要求這個格式，但寬鬆比對比較保險
    // （半形/全形冒號都收，數字可能帶小數）。抓不到就記 null：這一題不算進平均，
    // 但仍然算完成了一題（question_count 仍要涵蓋它，見 logSession()）。
    const scoreMatch = evalPart.match(/整體分數[：:]\s*(\d+(?:\.\d+)?)\s*\/\s*10/);
    const score = scoreMatch ? Math.max(0, Math.min(10, Number(scoreMatch[1]))) : null;
    sessionScores.push(score);

    addEvalMsg(evalPart, score, { log: true });
    pendingStep = null;

    if (questionCount >= MAX_Q) {
      // 訓練結束：帶得走的報告、這台裝置的練習紀錄、後端的 training_log
      finishTraining();
    } else if (!nextQ) {
      // 評分沒照格式附上下一題。以前這裡會直接判定訓練結束，五題變兩題就沒了；
      // 改成回頭用記者模式補問一題，格式漂移不該讓整場訓練提早收掉。
      reporterHist.push({ role: 'user', content: '（訓練系統）請直接提出下一個問題，只要問題本身，不要任何前綴或說明。' });
      await askNextQuestion();
    } else {
      // 繼續下一題。⚠️ 不要再把 nextQ 另外 push 進 reporterHist：上面那則 evalText
      // 本身就以「---下一題---」＋這一題結尾，再推一次等於同一題在歷程裡出現兩次、
      // 而且變成兩則連續的 assistant（批次 72 實測歷程是 assistant,user,assistant,assistant,user）。
      addReporterMsg(nextQ, { log: true });

      questionCount++;
      updateProgress();
      saveSession();

      enableAnswering();
    }
  } catch(e) {
    removeTyping();
    isWaiting = false;
    showRetry('連線中斷了。您剛才的回答還在，按下面重試就接著走。',
      () => evaluateAnswer(seconds, viaVoice));
    return;
  }

  isWaiting = false;
}

// ── 語音作答 ─────────────────────────────────────────────────────────
// 主管的原話：「真實記者會上沒有人在打字」。這一段負責把「按一下講、再按一下停」
// 變成一份逐字稿，交給 submitAnswer() 送去評分。
//
// 三層退路，任何一層垮掉都還練得完這一場：
//   ① 錄音上傳後端轉寫（品質最好，專有名詞會用活動知識庫當提示）
//   ② 後端沒設定 STT／轉寫失敗 → 用瀏覽器邊講邊出的即時辨識結果頂上
//   ③ 麥克風根本拿不到（沒權限、沒裝置、不是 HTTPS）→ 退回打字，並說清楚原因
//
// ⚠️ 不管哪一層，逐字稿都會先攤在主管眼前讓他改過再送出。辨識一定會有錯字，
// 尤其是專有名詞；沒得改的話，他會看到 AI 在評一段他沒講過的話。

function fmtTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

/** 這一段講到哪個區間了。切分方式跟 api/training.js 的 speechZone() 一樣。 */
function zoneOf(sec) {
  if (sec < TARGET_MIN_SEC) return 'short';
  if (sec <= TARGET_MAX_SEC) return 'target';
  if (sec <= TOO_LONG_SEC) return 'long';
  return 'toolong';
}

// 講到第幾秒就換一次顏色跟提示語。這是這一版真正要求主管的事：不是講完之後
// 在評語裡被告知「你講太久」，而是講到 60 秒的當下就看到催收尾的訊號——
// 真實的媒體訓練師就是在旁邊比手勢，不是事後寫檢討報告。
const ZONE_HINT = {
  short: `目標：${TARGET_MAX_SEC / 60} 分鐘內講完重點`,
  target: '重點時間，可以準備收尾了',
  long: `已經超過 ${TARGET_MAX_SEC} 秒，請收尾`,
  toolong: '太長了，記者會抓不到重點',
};

function updateTimeZone(sec) {
  const status = document.getElementById('rec-status');
  const zone = zoneOf(sec);
  if (status.dataset.zone === zone) return;   // 只在跨區的那一刻動 DOM
  status.dataset.zone = zone;
  status.classList.remove('zone-short', 'zone-target', 'zone-long', 'zone-toolong');
  status.classList.add('zone-' + zone);
  // 沒收到聲音的警告優先，不要被時間提示蓋掉
  if (!status.classList.contains('silent')) {
    document.getElementById('rec-hint').textContent = ZONE_HINT[zone];
  }
}

function showPane(name) {
  document.getElementById('voice-pane').style.display = name === 'voice' ? 'flex' : 'none';
  document.getElementById('confirm-pane').style.display = name === 'confirm' ? 'flex' : 'none';
  document.getElementById('type-pane').style.display = name === 'type' ? 'flex' : 'none';
}

function setVoiceNote(text, warn) {
  const el = document.getElementById('voice-note');
  el.textContent = text || '';
  el.className = warn ? 'warn' : '';
}

/** 瀏覽器到底能不能錄音。非 HTTPS 時 navigator.mediaDevices 根本不存在。 */
function canRecord() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}

// MediaRecorder 各家吃的格式不一樣：Chrome／Edge／Android 給 webm（opus），
// Safari／iOS 給 mp4（aac）。挑第一個這台機器真的支援的，挑不到就讓瀏覽器自己決定。
/**
 * 錄音要用哪個容器。
 *
 * ⚠️ 順序不是隨便排的，它決定「這段錄音在伺服器上轉不轉得成逐字稿」：
 * Gemini 吃得下 mp4/aac 與 ogg/opus，**吃不下 webm**（見 api/training.js 的
 * pickTranscribeEngine）。舊版第一順位是 webm，也就是偏偏挑了那個免費引擎讀不了的格式——
 * 結果在 Chrome／Android 上，就算 GEMINI_API_KEY 設好了也永遠用不到伺服器辨識，
 * 一路退到瀏覽器的即時辨識。這件事不會報錯，只會讓逐字稿品質莫名其妙比 iPhone 差。
 *
 * 實測 Chromium 141 支援 audio/mp4（裡面裝的是 Opus，不是 AAC——
 * `audio/mp4;codecs=mp4a.40.2` 在同一版是不支援的）；Safari／iOS 本來就給 mp4／AAC，
 * Firefox 給 ogg。所以先問這幾個，都不支援才退回 webm。
 *
 * ⚠️ 還沒實測的一件事：Gemini 收不收「MP4 容器裝 Opus」這個組合（它的文件列的是
 * aac／ogg／wav／mp3／flac）。**不確定也值得換**，因為換了只有上檔沒有下檔——
 * Gemini 讀不懂的話後端回 502 帶 fallback:'browser'，前端照樣用瀏覽器那份逐字稿，
 * 就跟現在的 webm 一模一樣；讀得懂就白賺一份品質更好的辨識。
 * 要確認的話：設好 GEMINI_API_KEY，用 Chrome 錄一題，看逐字稿確認畫面還會不會
 * 跳「伺服器的語音辨識還沒啟用」——不跳就是成功走到 Gemini 了。
 */
function pickRecMime() {
  const prefer = ['audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm'];
  for (const t of prefer) {
    try { if (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t; } catch (e) {}
  }
  return '';
}

function setAnswerMode(mode, remember = true) {
  answerMode = mode === 'type' ? 'type' : 'voice';
  if (remember) { try { localStorage.setItem(ANSWER_MODE_LS_KEY, answerMode); } catch (e) {} }
  showPane(answerMode === 'voice' ? 'voice' : 'type');
  if (awaitingAnswer) enableAnswering();
}

/** 這一題可以作答了：依目前模式打開麥克風按鈕或打字框。 */
function enableAnswering() {
  awaitingAnswer = true;
  if (answerMode === 'voice') {
    showPane('voice');
    const btn = document.getElementById('mic-btn');
    btn.disabled = false;
    btn.classList.remove('recording');
    document.getElementById('mic-label').textContent = '按一下開始講';
    document.getElementById('rec-status').style.display = 'none';
    document.getElementById('live-caption').style.display = 'none';
  } else {
    showPane('type');
    const box = document.getElementById('user-input');
    box.disabled = false;
    box.focus();
    document.getElementById('send-btn').disabled = false;
  }
}

/** 送出之後、AI 還在想的時候：把所有作答入口關起來，免得重複送出。 */
function lockAnswering() {
  document.getElementById('mic-btn').disabled = true;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('user-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('rec-status').style.display = 'none';
  document.getElementById('live-caption').style.display = 'none';
  setVoiceNote('');
  showPane(answerMode === 'voice' ? 'voice' : 'type');
}

// ── 瀏覽器即時辨識（只當作視覺回饋＋後端轉寫失敗時的備胎）────────────
function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  try {
    const rec = new SR();
    rec.lang = 'zh-TW';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      liveInterim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) liveFinal += t;
        else liveInterim += t;
      }
      const cap = document.getElementById('live-caption');
      cap.style.display = 'block';
      cap.textContent = (liveFinal + liveInterim) || '（聽著…）';
      cap.scrollTop = cap.scrollHeight;
    };
    // ⚠️ Chrome 講到一半停頓幾秒就會自己 onend，continuous=true 也擋不住。
    // 還在錄音的話要馬上接回去，不然後半段整個不見。
    rec.onend = () => { if (recording) { try { rec.start(); } catch (e) {} } };
    rec.onerror = () => {}; // 辨識掛掉不影響錄音，後端轉寫才是主力
    return rec;
  } catch (e) { return null; }
}

// ── 音量監測 ─────────────────────────────────────────────────────────
// 「按了錄音但其實沒收到聲音」是這種介面最典型的失敗：系統把麥克風靜音了、
// 選到一支沒接的裝置，MediaRecorder 照樣產出一個有長度、內容全空的檔案，
// 完全不會報錯。畫面上那條會動的量表，就是唯一的徵兆。
function monitorLevel(stream) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);

    const tick = () => {
      if (!recording || !analyser) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      if (rms > peakLevel) peakLevel = rms;
      document.getElementById('level-fill').style.width = Math.min(100, rms * 320) + '%';
      levelRaf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { /* 量不到就算了，不影響錄音本身 */ }
}

async function startRecording() {
  if (recording || isWaiting || !awaitingAnswer) return;

  if (!canRecord()) {
    setAnswerMode('type');
    addSystemMsg(location.protocol === 'https:' || location.hostname === 'localhost'
      ? '這個瀏覽器不支援錄音，已改用打字作答。'
      : '錄音需要 HTTPS 才能使用，已改用打字作答。');
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setAnswerMode('type');
    addSystemMsg(denied
      ? '瀏覽器擋住了麥克風權限。請在網址列左邊的圖示允許麥克風後重試，先用打字也可以。'
      : '找不到可以用的麥克風，已改用打字作答。');
    return;
  }

  mediaStream = stream;
  recChunks = [];
  peakLevel = 0;
  liveFinal = '';
  liveInterim = '';
  recStartedAt = Date.now();
  recording = true;

  const mime = pickRecMime();
  // 位元率看容器：Opus 在 32 kbps 講話已經很清楚，AAC（mp4）在同樣的 32 kbps 會糊掉，
  // 而糊掉的代價是逐字稿錯字變多。64 kbps × 上限 150 秒約 1.2 MB，base64 後仍在
  // MAX_AUDIO_BASE64（3.5 MB）之內，付得起。
  const bitrate = /mp4|aac/.test(mime) ? 64000 : 32000;
  try {
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: bitrate } : undefined);
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream);
  }
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const seconds = (Date.now() - recStartedAt) / 1000;
    const type = (mediaRecorder && mediaRecorder.mimeType) || mime || 'audio/webm';
    const blob = recChunks.length ? new Blob(recChunks, { type }) : null;
    cleanupRecording();
    finishRecording(blob, type, seconds);
  };
  mediaRecorder.start(1000); // 每秒切一塊，長回答也不會整段卡在記憶體裡

  speechRec = setupSpeechRecognition();
  if (speechRec) { try { speechRec.start(); } catch (e) {} }
  monitorLevel(stream);

  // UI：進入錄音中
  const btn = document.getElementById('mic-btn');
  btn.classList.add('recording');
  document.getElementById('mic-label').textContent = '講完了，按這裡停止';
  const status = document.getElementById('rec-status');
  status.style.display = 'flex';
  status.classList.remove('silent');
  document.getElementById('rec-time').textContent = '0:00';
  document.getElementById('rec-target').textContent =
    `目標 ${fmtTime(TARGET_MIN_SEC)}–${fmtTime(TARGET_MAX_SEC)}`;
  status.classList.remove('zone-short', 'zone-target', 'zone-long', 'zone-toolong');
  delete status.dataset.zone;
  updateTimeZone(0);
  document.getElementById('level-fill').style.width = '0%';
  setVoiceNote('');

  recTimer = setInterval(() => {
    const sec = (Date.now() - recStartedAt) / 1000;
    document.getElementById('rec-time').textContent = fmtTime(sec);
    updateTimeZone(sec);
    // 講了 5 秒還完全沒有音量＝十之八九麥克風沒收到，當下就要講，不要等他講完。
    // ⚠️ 這條要壓過時間提示：麥克風沒開，比講太久嚴重得多。
    if (sec > 5 && peakLevel < SILENT_PEAK) {
      status.classList.add('silent');
      document.getElementById('rec-hint').textContent = '幾乎沒收到聲音，請確認麥克風';
    }
  }, 250);

  autoStopTimer = setTimeout(() => {
    if (recording) {
      setVoiceNote(`單題錄音上限 ${Math.round(MAX_REC_SECONDS / 60 * 10) / 10} 分鐘，已自動停止。`, true);
      stopRecording();
    }
  }, MAX_REC_SECONDS * 1000);
}

function stopRecording(abandon = false) {
  if (!recording) return;
  abandonRecording = !!abandon;
  recording = false;
  try { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').disabled = true;
  document.getElementById('mic-label').textContent = '辨識中…';
}

/** 錄音相關資源一律收乾淨——麥克風沒關掉，分頁上的紅點會一直亮著。 */
function cleanupRecording() {
  clearInterval(recTimer); recTimer = null;
  clearTimeout(autoStopTimer); autoStopTimer = null;
  if (levelRaf) { cancelAnimationFrame(levelRaf); levelRaf = null; }
  if (speechRec) { try { speechRec.stop(); } catch (e) {} speechRec = null; }
  if (analyser) { try { analyser.disconnect(); } catch (e) {} analyser = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} }); mediaStream = null; }
  document.getElementById('rec-status').style.display = 'none';
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

// 伺服器成功轉寫、但一個字都沒聽到（主管按了錄音卻沒開口，或麥克風沒收到人聲）。
// 抽成常數是因為下面 finishRecording() 要認得它：瀏覽器那份頂上來之後，這句話就不再成立了。
const EMPTY_NOTE = '這段錄音裡沒有聽到說話的內容。請按「重錄」再講一次，或直接在下面打字。';

/** 把音檔丟給後端轉寫。回 { text, note } —— note 是要讓主管知道的狀況說明。 */
async function transcribeBlob(blob, mime) {
  const audio = await blobToBase64(blob);
  const res = await fetch('/api/training', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mode: 'transcribe',
      event_id: eventId,
      audio,
      mime,
      code: TRAINING_CODE || undefined,
      password: TRAINING_PWD || undefined,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.text) return { text: data.text };
  if (res.ok && data.empty) return { text: '', note: EMPTY_NOTE };
  // fallback 代表後端沒設定轉寫服務或轉寫壞了——瀏覽器邊講邊出的那份頂上來，
  // 讓主管不用重講一次。品質會差一點，所以要講清楚為什麼。
  if (data.fallback === 'browser') {
    if (sttFallbackNoticed) return { text: '' };   // 講過了，後面幾題不用再佔版面
    sttFallbackNoticed = true;
    return { text: '', note: '伺服器的語音辨識還沒啟用，先用瀏覽器聽到的版本（專有名詞可能有錯字，送出前確認一下）' };
  }
  return { text: '', note: data.error || '語音辨識失敗，請確認內容或改用打字。' };
}

async function finishRecording(blob, mime, seconds) {
  // 使用者自己中斷的（改用打字、重新開始一場），就到此為止——這段錄音不送去
  // 辨識，也不要跳出確認畫面蓋掉他剛切過去的介面。
  if (abandonRecording) { abandonRecording = false; return; }
  pendingSeconds = seconds;
  const live = (liveFinal + liveInterim).trim();

  let text = '';
  let note = '';

  if (seconds < 1.2) {
    note = '這段太短了（不到 1 秒），請按「重錄」再講一次。';
  } else if (blob && blob.size > 2000) {
    try {
      const r = await transcribeBlob(blob, mime);
      text = r.text || '';
      note = r.note || '';
    } catch (e) {
      note = '語音辨識連線失敗，以下是瀏覽器聽到的版本，請確認一下。';
    }
  } else {
    note = '沒有錄到聲音，請確認麥克風後重錄。';
  }

  // 後端沒給逐字稿就用瀏覽器那份；兩份都沒有就留空框讓他自己補或重錄——
  // 卡在這裡不給任何出路，才是最糟的情況。
  // ⚠️ 換成瀏覽器那份時，note 也要跟著換掉，不能只在 note 是空的時候才補。
  // 後端回「沒有聽到說話的內容」而瀏覽器其實聽到了，兩句話會同時出現在畫面上——
  // 框裡明明有字，上面卻寫著沒聽到，主管只會以為系統壞了。
  // 「伺服器辨識還沒啟用」那句要留著（它講的是另一件事，而且比較有資訊）。
  if (!text && live) {
    text = live;
    if (!note || note === EMPTY_NOTE) note = '以下是瀏覽器聽到的版本，請確認一下。';
  }
  if (!text && peakLevel < SILENT_PEAK && seconds >= 1.2) {
    note = '整段幾乎沒有音量，麥克風可能沒有開。請按「重錄」，或直接在下面打字。';
  }
  // 有收到聲音、但兩層辨識都交不出字（例如這個瀏覽器沒有即時辨識、伺服器也還沒設定）。
  // 舊版這時會顯示一個空白框配一句「聽到的是這樣，送出前可以直接改」——聽到的是空的，
  // 這句話只會讓人以為系統壞了。講清楚發生什麼事，並指出還走得通的那條路。
  if (!text && !note) {
    note = '這個瀏覽器沒有辨識出文字。可以按「重錄」再講一次，或直接在下面打字送出。';
  }
  showTranscript(text, note);
}

function showTranscript(text, note) {
  showPane('confirm');
  const box = document.getElementById('transcript-box');
  box.value = text || '';
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 160) + 'px';
  // ⚠️ **有逐字稿的時候**，秒數跟長度評語永遠要顯示，不能被 note 蓋掉——這場演練練的就是長度。
  // 舊版寫成 `note ? note : 秒數`，結果只要出現任何提示訊息（例如伺服器辨識沒啟用），
  // 主管整題都看不到自己講了多久。這條規則不能弄丟。
  //
  // 但**逐字稿是空的**時候相反：「講了 0:04，比目標短——重點講完就好，短不是問題」
  // 是在評論一段根本不存在的回答，還跟後面那句「沒有聽到說話的內容」自相矛盾。
  // 空的時候只講兩件事：發生了什麼，以及下一步怎麼辦。
  const hasText = !!String(box.value).trim();
  const zone = zoneOf(pendingSeconds);
  const ZONE_TAIL = {
    short: '，比目標短——重點講完就好，短不是問題',
    target: `，落在目標 ${fmtTime(TARGET_MIN_SEC)}–${fmtTime(TARGET_MAX_SEC)} 內 👍`,
    long: `，超過目標的 ${TARGET_MAX_SEC} 秒`,
    toolong: `，比目標的 ${TARGET_MAX_SEC} 秒久了不少`,
  };
  const head = [];
  if (hasText && pendingSeconds >= 1.2) head.push(`講了 ${fmtTime(pendingSeconds)}${ZONE_TAIL[zone] || ''}`);
  head.push(note || (hasText
    ? '聽到的是這樣，送出前可以直接改'
    : '沒有辨識到內容。請按「重錄」再講一次，或直接在下面打字。'));
  document.getElementById('confirm-head-text').textContent = head.join('｜');
  document.getElementById('confirm-send-btn').disabled = !String(box.value).trim();
  box.focus();
}

function sendTranscript() {
  const text = document.getElementById('transcript-box').value.trim();
  if (!text) return;
  submitAnswer(text, pendingSeconds, true);
}

function redoRecording() {
  document.getElementById('transcript-box').value = '';
  pendingSeconds = 0;
  enableAnswering();
}

// 訓練走到終畫面才呼叫（見 finishTraining()；單題重練不呼叫）——中途
// 離開的不記，不然「演練場次」會被答一題就走的雜訊灌水。fire-and-forget：不 await
// 結果來擋終畫面顯示，訓練本身已經結束，紀錄寫不寫得進去不該讓受訓者等待或看到
// 錯誤畫面；寫成功的話，把後端重新算好的平均分（不是前端自己算的那份）補上去。
async function logSession() {
  if (!sessionScores.length) return; // 一題都沒有（理論上不會發生，防呆）
  try {
    const res = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'log_session',
        event_id: eventId,
        trainee: document.getElementById('trainee-input').value.trim(),
        scores: sessionScores,
        voice_answers: voiceAnswerCount,
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined
      })
    });
    const data = await res.json();
    // 報告那一行 renderReport() 早就用前端的分數寫好了；後端重新算的平均（同一批分數，
    // 正常情況兩個數字一樣）回來時再覆寫一次，以後端為準。使用者已經開始單題重練時不要蓋。
    if (!isDrill && data.success && data.avg_score !== '' && data.avg_score != null) {
      const via = voiceAnswerCount ? `（${voiceAnswerCount} / ${sessionScores.length} 題用講的）` : '';
      document.getElementById('end-avg').textContent = `本次平均分：${data.avg_score} / 10 ${via}`.trim();
    }
  } catch(e) {
    console.error('訓練紀錄寫入失敗（不影響剛剛的訓練結果）:', e);
  }
}

function updateProgress() {
  const pct = Math.min((questionCount / MAX_Q) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `${Math.min(questionCount, MAX_Q)} / ${MAX_Q} 題`;
}

// 訊息渲染
// { log: true } ＝這是新內容，記進 sessionLog（報告、下載、接著練都靠它）。
// 接著練時重畫舊內容走 renderEntry()，不帶 log，免得同一則被記兩次。
function logEntry(entry) {
  sessionLog.push(entry);
}
function renderEntry(e) {
  if (e.k === 'q') addReporterMsg(e.text);
  else if (e.k === 'a') addUserMsg(e.text, e.voice ? e.sec : 0);
  else if (e.k === 'e') addEvalMsg(e.text, e.score);
}

function addReporterMsg(text, { log = false } = {}) {
  if (log) logEntry({ k: 'q', text });
  const el = document.createElement('div');
  el.className = 'msg reporter';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-microphone"></i></div>
    <div class="bubble"><span class="label">AI 記者</span><br>${escHtml(text)}</div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addUserMsg(text, seconds, { log = false, voice = false } = {}) {
  if (log) logEntry({ k: 'a', text, sec: seconds || 0, voice: !!voice });
  const el = document.createElement('div');
  el.className = 'msg user';
  // 講了多久是真實媒體訓練會看的數字（電視新聞一則受訪片段大約 8–15 秒），
  // 貼在自己的回答下面，比只寫在評語裡更有感。
  const over = seconds > TARGET_MAX_SEC;
  const meta = seconds
    ? `<span class="meta${over ? ' over' : ''}"><i class="ti ti-microphone"></i> 用講的 · ${fmtTime(seconds)}`
      + `${over ? `（超過目標 ${TARGET_MAX_SEC} 秒）` : ''}</span>`
    : '';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-user"></i></div>
    <div class="bubble">${escHtml(text)}${meta}</div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// ⚠️ 泡泡是 white-space: pre-wrap——模板字串裡 <div class="bubble"> 後面的換行與縮排會被原樣
// 畫出來，每個泡泡上方都多一大塊空白（手機上一則評分因此多佔兩三行）。泡泡內容一律寫在同一行。

/** 畫面上顯示的評語：拿掉開頭那行「---評分---」（那是給程式切分用的，徽章已經放大顯示分數）。 */
function displayEval(text) {
  return String(text || '').replace(/^\s*[-—–─]{2,}[^\n]*評分[^\n]*[-—–─]{2,}\s*\n?/, '').trim();
}

function addEvalMsg(text, score, { log = false } = {}) {
  if (log) logEntry({ k: 'e', text, score });
  const el = document.createElement('div');
  el.className = 'msg eval';
  // 分數已經在內文的「整體分數：X / 10」那行了，這裡另外用徽章放大呈現一次——
  // 內文是完整記錄，徽章是讓人一眼掃過去就抓到重點，不衝突。
  const badge = (score != null) ? `<span class="score-badge">${score}<span class="of10">/10</span></span><br>` : '';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-star"></i></div>
    <div class="bubble"><span class="eval-label">訓練師評分</span><br>${badge}${escHtml(displayEval(text))}</div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addSystemMsg(text) {
  const el = document.createElement('div');
  el.style.cssText = 'text-align:center;color:#9ca3af;font-size:0.82rem;padding:8px';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
}

function showTyping(type) {
  const el = document.createElement('div');
  el.className = `msg ${type === 'eval' ? 'eval' : 'reporter'}`;
  el.id = 'typing';
  const icon = type === 'eval' ? 'ti-star' : 'ti-microphone';
  el.innerHTML = `
    <div class="avatar"><i class="ti ${icon}"></i></div>
    <div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span><span class="wait-hint"></span></div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  // 評分通常要十幾秒。只有三個點在跳、什麼字都沒有，人過了十秒就會開始懷疑是不是
  // 當掉了、想重新整理——而重新整理正是最不該在這時候做的事。過一陣子補一句話。
  const hint = el.querySelector('.wait-hint');
  const say = (t) => { if (hint && document.getElementById('typing') === el) hint.textContent = t; };
  typingTimers.push(setTimeout(() => say(type === 'eval'
    ? '訓練師正在看您的回答，通常 10–20 秒…' : '記者正在準備問題…'), 5000));
  typingTimers.push(setTimeout(() => say('比平常久一點，再等一下；真的沒回應會出現「再試一次」。'), 25000));
}

let typingTimers = [];
function removeTyping() {
  typingTimers.forEach(clearTimeout);
  typingTimers = [];
  document.getElementById('typing')?.remove();
}

// ── 語音作答的事件綁定 ──────────────────────────────────────────────
document.getElementById('mic-btn').addEventListener('click', () => {
  if (recording) stopRecording(); else startRecording();
});
document.getElementById('switch-to-type').addEventListener('click', () => {
  if (recording) stopRecording(true);
  setAnswerMode('type');
});
document.getElementById('switch-to-voice').addEventListener('click', () => setAnswerMode('voice'));
document.getElementById('redo-btn').addEventListener('click', redoRecording);
document.getElementById('confirm-send-btn').addEventListener('click', sendTranscript);
document.getElementById('transcript-box').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  document.getElementById('confirm-send-btn').disabled = !this.value.trim();
});
document.getElementById('transcript-box').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTranscript(); }
});
// 離開頁面時把麥克風關掉，不然分頁上的錄音紅點會一直亮著
window.addEventListener('pagehide', () => { recording = false; cleanupRecording(); });

// 輸入事件
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return; // 中文輸入法選字時的 Enter，不當作送出
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitAnswer(); }
});
// ⚠️ 一定要包一層：直接傳 submitAnswer 的話，點擊事件物件會被當成回答內容（見 submitAnswer 的說明）
document.getElementById('send-btn').addEventListener('click', () => submitAnswer());
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

init();
</script>
</body>
</html>
