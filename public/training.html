<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒體訓練模式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/tabler-icons.min.css">
<style>
  :root {
    --primary: #e85d04;
    --primary-dark: #c44d03;
    --primary-light: rgba(232,93,4,0.08);
    --text: #1a1a2e;
    --muted: #6b7280;
    --bg: #fdf5f0;
    --card: #ffffff;
    --border: #e5e7eb;
    --radius: 12px;
    --font: 'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }

  #header {
    background: var(--primary);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  #header h1 { font-size: 1.1rem; font-weight: 700; }
  #header p { font-size: 0.78rem; opacity: 0.85; margin-top: 1px; }
  #back-link {
    margin-left: auto;
    color: rgba(255,255,255,0.8);
    font-size: 0.82rem;
    text-decoration: none;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    transition: all 0.15s;
  }
  #back-link:hover { background: rgba(255,255,255,0.15); color: white; }

  /* 說明卡片 */
  #info-card {
    margin: 12px 16px 0;
    background: var(--primary-light);
    border: 1px solid rgba(232,93,4,0.2);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #7c3a0a;
    line-height: 1.6;
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  #info-card i { font-size: 20px; color: var(--primary); flex-shrink: 0; margin-top: 1px; }

  /* 進度條 */
  #progress-bar {
    padding: 10px 16px 4px;
    flex-shrink: 0;
  }
  #progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  #progress-track { height: 6px; background: var(--border); border-radius: 3px; }
  #progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s; width: 0%; }

  /* Chat */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 12px 16px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .msg.reporter .avatar { background: #1a1a2e; color: white; }
  .msg.user .avatar { background: #0F9E7A; color: white; }
  .msg.eval .avatar { background: #6366f1; color: white; }
  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.reporter .bubble {
    background: #1a1a2e; color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .msg.reporter .bubble .label {
    display: inline-block;
    background: var(--primary);
    color: white;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
  }
  .msg.user .bubble { background: #0F9E7A; color: white; border-bottom-right-radius: 4px; }
  .msg.eval .bubble {
    background: #f0f0ff;
    border: 1px solid #c7d2fe;
    border-bottom-left-radius: 4px;
    color: #3730a3;
  }
  .msg.eval .bubble .eval-label {
    display: inline-block;
    background: #6366f1;
    color: white;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
  }

  /* 分數徽章 */
  .score-badge {
    display: inline-block;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
    margin-right: 4px;
  }
  .score-badge .of10 { font-size: 0.9rem; font-weight: 600; color: var(--muted); }

  /* Typing */
  .typing-dot { display: inline-block; width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

  /* Input */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: white;
    display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 16px;
    resize: none; overflow-y: auto; max-height: 120px;
    line-height: 1.5; outline: none;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: #0F9E7A; }
  #user-input:disabled { background: #f9fafb; color: var(--muted); }
  #send-btn {
    width: 44px; height: 44px;
    border: none; border-radius: 10px;
    background: #0F9E7A; color: white;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { background: #0a7a60; }
  #send-btn:disabled { background: var(--border); cursor: default; }

  /* ── 語音作答 ──────────────────────────────────────────────── */
  #input-area.voice { flex-direction: column; align-items: stretch; gap: 8px; }
  #voice-pane, #confirm-pane, #type-pane { display: flex; flex-direction: column; gap: 8px; }
  #type-pane { flex-direction: row; align-items: flex-end; gap: 10px; }

  #mic-row { display: flex; align-items: center; gap: 10px; }
  #mic-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px;
    background: #0F9E7A; color: white;
    padding: 14px 20px;
    font-family: var(--font); font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  #mic-btn:hover:not(:disabled) { background: #0a7a60; }
  #mic-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
  #mic-btn.recording { background: #dc2626; }
  #mic-btn.recording:hover { background: #b91c1c; }
  #mic-btn i { font-size: 20px; }

  .link-btn {
    background: none; border: none;
    color: var(--muted); font-family: var(--font); font-size: 0.82rem;
    text-decoration: underline; cursor: pointer; padding: 6px 2px;
    flex-shrink: 0;
  }
  .link-btn:hover { color: var(--primary); }

  #rec-status { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
  .rec-row { display: flex; align-items: center; gap: 8px; }
  #rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #dc2626; animation: pulse 1s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  #rec-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); font-size: 0.95rem; }
  #rec-target { font-size: 0.74rem; flex-shrink: 0; }
  #rec-hint { font-size: 0.78rem; }

  /* 講到第幾秒就換一次顏色與提示。真實媒體訓練師會在旁邊比手勢示意收尾，
     這幾行就是那個手勢——事後在評語裡才被告知「你講太久了」，已經來不及了。 */
  #rec-status.zone-target #rec-time { color: #0F9E7A; }
  #rec-status.zone-target #rec-hint { color: #0F9E7A; font-weight: 600; }
  #rec-status.zone-long #rec-time,
  #rec-status.zone-long #rec-hint { color: #d97706; font-weight: 700; }
  #rec-status.zone-toolong #rec-time,
  #rec-status.zone-toolong #rec-hint { color: #dc2626; font-weight: 700; }
  #rec-status.zone-long #level-fill { background: #d97706; }
  #rec-status.zone-toolong #level-fill { background: #dc2626; }

  /* 音量條不是裝飾。「按了錄音但麥克風其實沒收到聲音」是這種介面最常見的失敗，
     而且失敗當下毫無徵兆——講完兩分鐘才發現整段是空的。這條會動，才代表真的錄到。 */
  #level-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 40px; }
  #level-fill { height: 100%; width: 0%; background: #0F9E7A; border-radius: 3px; transition: width 0.08s linear; }
  #rec-status.silent #level-fill { background: #f59e0b; }
  #rec-status.silent #rec-hint { color: #b45309; font-weight: 600; }

  #live-caption {
    background: #f9fafb; border: 1px dashed var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.86rem; line-height: 1.6; color: var(--muted);
    max-height: 90px; overflow-y: auto;
  }

  #confirm-pane .confirm-head {
    font-size: 0.8rem; color: var(--primary); font-weight: 600;
    display: flex; align-items: center; gap: 5px;
  }
  #transcript-box {
    border: 1.5px solid #0F9E7A; border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    resize: none; overflow-y: auto; max-height: 160px; outline: none;
  }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button {
    border-radius: 10px; padding: 11px 16px;
    font-family: var(--font); font-size: 0.9rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: none; transition: background 0.2s;
  }
  #redo-btn { background: white; border: 1.5px solid var(--border); color: var(--muted); }
  #redo-btn:hover { border-color: var(--primary); color: var(--primary); }
  #confirm-send-btn { flex: 1; background: #0F9E7A; color: white; }
  #confirm-send-btn:hover:not(:disabled) { background: #0a7a60; }
  #confirm-send-btn:disabled { background: var(--border); cursor: default; }

  #voice-note { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  #voice-note.warn { color: #b45309; }

  /* 作答方式標記（貼在使用者泡泡下面，讓人看得出這題是講的還是打的） */
  .msg.user .meta {
    display: block; margin-top: 5px;
    font-size: 0.72rem; opacity: 0.75;
  }
  .msg.user .meta.over { opacity: 1; color: #fde68a; font-weight: 700; }

  /* 開始按鈕 */
  #start-area {
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #trainee-input {
    width: 100%; max-width: 320px;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 0.9rem;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  #trainee-input:focus { border-color: var(--primary); }
  #start-btn {
    background: var(--primary); color: white;
    border: none; border-radius: 10px;
    padding: 14px 32px;
    font-family: var(--font); font-size: 1rem; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
  }
  #start-btn:hover { background: var(--primary-dark); }

  /* 結束畫面 */
  #end-screen {
    display: none;
    padding: 30px 20px;
    text-align: center;
    flex-shrink: 0;
  }
  #end-screen .trophy { font-size: 52px; margin-bottom: 12px; }
  #end-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
  #end-screen p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  #restart-btn {
    background: var(--primary); color: white;
    border: none; border-radius: 10px;
    padding: 12px 28px;
    font-family: var(--font); font-size: 0.95rem; font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  #restart-btn:hover { background: var(--primary-dark); }

  /* Loading */
  #loading {
    position: fixed; inset: 0;
    background: rgba(253,245,240,0.9);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; font-size: 0.95rem; color: var(--muted);
    z-index: 100;
  }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>載入活動資訊中…</span>
</div>

<div id="header">
  <i class="ti ti-microphone" style="font-size:26px"></i>
  <div>
    <h1 id="event-title">媒體訓練模式</h1>
    <p id="event-subtitle">AI 記者實戰演練</p>
  </div>
  <a id="back-link" href="#"><i class="ti ti-arrow-left"></i> 母後台</a>
</div>

<div id="info-card">
  <i class="ti ti-info-circle"></i>
  <span>AI 將扮演犀利記者向您提問，<strong>直接用講的回答就好</strong>，不用打字。每題請在 <strong>30 秒到 1 分鐘內把重點講完</strong>——這是記者真正用得到的長度。每題回答後 AI 會就您講的內容與長度評分。共 <strong>5 題</strong>。</span>
</div>

<div id="progress-bar">
  <div id="progress-label">
    <span>訓練進度</span>
    <span id="q-counter">0 / 5 題</span>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="messages"></div>

<div id="start-area">
  <input id="trainee-input" type="text" maxlength="40"
         placeholder="您的姓名／職稱（選填，方便主管追蹤訓練紀錄）">
  <button id="start-btn">
    <i class="ti ti-player-play"></i> 開始媒體訓練
  </button>
</div>

<div id="input-area" class="voice" style="display:none">
  <!-- ① 語音作答（預設）：按一下開始講，再按一下停止 -->
  <div id="voice-pane">
    <div id="mic-row">
      <button id="mic-btn" type="button" disabled>
        <i class="ti ti-microphone"></i><span id="mic-label">按一下開始講</span>
      </button>
      <button id="switch-to-type" class="link-btn" type="button">改用打字</button>
    </div>
    <div id="rec-status" style="display:none">
      <div class="rec-row">
        <span id="rec-dot"></span>
        <span id="rec-time">0:00</span>
        <span id="rec-target">目標 0:30–1:00</span>
        <div id="level-track"><div id="level-fill"></div></div>
      </div>
      <div id="rec-hint">目標：1 分鐘內講完重點</div>
    </div>
    <div id="live-caption" style="display:none"></div>
    <div id="voice-note"></div>
  </div>

  <!-- ② 逐字稿確認：辨識一定會有錯字，送出前一定要讓主管自己改 -->
  <div id="confirm-pane" style="display:none">
    <div class="confirm-head"><i class="ti ti-ear"></i> <span id="confirm-head-text">聽到的是這樣，送出前可以直接改</span></div>
    <textarea id="transcript-box" rows="3"></textarea>
    <div class="confirm-actions">
      <button id="redo-btn" type="button"><i class="ti ti-refresh"></i> 重錄</button>
      <button id="confirm-send-btn" type="button"><i class="ti ti-send"></i> 送出作答</button>
    </div>
  </div>

  <!-- ③ 打字作答：永遠留著這條路。麥克風壞了、在開放空間不方便講、辨識一直失敗，
       都得有辦法把這場練完。 -->
  <div id="type-pane" style="display:none">
    <textarea id="user-input" rows="1" placeholder="輸入您的回答…（Enter 送出，Shift+Enter 換行）" disabled></textarea>
    <button id="send-btn" disabled><i class="ti ti-send"></i></button>
    <button id="switch-to-voice" class="link-btn" type="button">改用講的</button>
  </div>
</div>

<div id="end-screen">
  <div class="trophy">🎯</div>
  <h2>訓練完成！</h2>
  <p id="end-avg" style="font-weight:700;color:var(--primary);font-size:1.05rem;margin-bottom:6px"></p>
  <p>您已完成本次媒體訓練。請參考各題的評分建議，調整您的發言策略。</p>
  <button id="restart-btn"><i class="ti ti-refresh"></i> 再練一次</button>
</div>

<script>
const params = new URLSearchParams(location.search);
let eventId = params.get('id');
// 這支功能只給內部人用：帶 ?code=（同仁該場的編輯碼）或已在後台登入過（sessionStorage 有密碼）才能用
const TRAINING_CODE = params.get('code') || '';
const TRAINING_PWD = sessionStorage.getItem('itri_pwd') || '';
let reporterHist = [];  // 記者對話歷程
let questionCount = 0;
const MAX_Q = 5;
let isWaiting = false;
let awaitingAnswer = false; // 等待使用者回答
let eventName = '工研院活動';

// 這場的每題分數，null 代表這題的評分文字沒解析出「整體分數：X / 10」（極少見，
// AI 格式漂移時才會發生）。只在真的走到終畫面（5 題全部答完）才會送去記錄——
// 中途離開的不算一場，見 startTraining()／submitAnswer() 裡的說明。
let sessionScores = [];

// ── 語音作答狀態 ─────────────────────────────────────────────────────
// 'voice' | 'type'。記在瀏覽器裡，下次進來維持上次的選擇——在開放空間不方便
// 講話的人，不該每一題都要重按一次「改用打字」。
const ANSWER_MODE_LS_KEY = 'itri_training_answer_mode';
let answerMode = 'voice';
let recording = false;
let mediaRecorder = null, mediaStream = null, audioCtx = null, analyser = null;
let recChunks = [], recStartedAt = 0, recTimer = null, levelRaf = null, autoStopTimer = null;
// 整段錄音看到的最大音量。麥克風被系統靜音時，MediaRecorder 一樣會乖乖產出一個
// 「有長度但整段是無聲」的檔案，不會報錯——只能自己量。
let peakLevel = 0;
let speechRec = null, liveFinal = '', liveInterim = '';
let abandonRecording = false; // 錄到一半改用打字／重新開始：停下來就好，不要跳確認畫面
let pendingSeconds = 0;     // 待送出的這段講了幾秒
let voiceAnswerCount = 0;   // 這場有幾題是用講的（寫進演練紀錄）

// 每一題的目標長度：30 秒到 1 分鐘把重點講完。
// ⚠️ 這兩個數字要跟 api/training.js 的 TARGET_MIN_SEC／TARGET_MAX_SEC 一致——畫面上
// 催他收尾的秒數，跟評分時用的標準不是同一個，主管會看到自己「準時收尾卻被說超時」。
// test/training-voice.test.mjs 有一條在比對這件事（同 test/kb-limit.test.mjs 的做法）。
const TARGET_MIN_SEC = 30;
const TARGET_MAX_SEC = 60;
const TOO_LONG_SEC = 90;

const MAX_REC_SECONDS = 150;   // 硬上限 2 分半：再長音檔會逼近 Vercel 的請求上限。
                               // 刻意留在目標值之上——讓講太久的人真的體驗到「太久」，
                               // 而不是一到 60 秒就被切掉、練不到自己收尾
const SILENT_PEAK = 0.02;      // 低於這個音量＝這段大概沒收到人聲

// 受訓者姓名/職稱記在瀏覽器裡，下次直接帶出來——跟 event.html 記住記者媒體名稱
// 同一招。純粹方便，不是必填；localStorage 讀不到就當作沒填過，不影響流程。
const TRAINEE_LS_KEY = 'itri_trainee_name';
function rememberedTrainee() {
  try { return localStorage.getItem(TRAINEE_LS_KEY) || ''; } catch (e) { return ''; }
}
function rememberTrainee(v) {
  try { if (v) localStorage.setItem(TRAINEE_LS_KEY, v); } catch (e) { /* 存不了就算了 */ }
}

async function init() {
  // 設定返回連結
  document.getElementById('back-link').href = '/';

  // 作答方式：沿用上次的選擇；這台機器根本錄不了音就直接退回打字，不要讓人
  // 按了麥克風才發現不能用。
  let saved = 'voice';
  try { saved = localStorage.getItem(ANSWER_MODE_LS_KEY) || 'voice'; } catch (e) {}
  if (!canRecord()) {
    setAnswerMode('type', false);
    setVoiceNote('這個瀏覽器（或非 HTTPS 連線）不支援錄音，已改用打字。', true);
  } else {
    setAnswerMode(saved, false);
  }

  const prevTrainee = rememberedTrainee();
  if (prevTrainee) document.getElementById('trainee-input').value = prevTrainee;

  if (!TRAINING_CODE && !TRAINING_PWD) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('info-card').innerHTML =
      '<i class="ti ti-lock"></i><span>這個功能只給內部同仁使用。請先從後台登入，再從活動卡片點「媒體訓練」進入本頁。</span>';
    document.getElementById('progress-bar').style.display = 'none';
    document.getElementById('start-area').style.display = 'none';
    return;
  }

  try {
    const res = await fetch('/api/events');
    const data = await res.json();
    const events = data.events || [];

    if (!eventId) {
      // 沒有指定活動 → 顯示選擇器
      document.getElementById('event-title').textContent = '媒體訓練模式';
      document.getElementById('loading').style.display = 'none';
      showEventSelector(events);
      return;
    }

    if (eventId === 'all') {
      eventName = '工研院彙整媒體訓練';
      document.getElementById('event-title').textContent = '彙整媒體訓練 — 全部活動';
      document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練（綜合所有活動）';
      document.title = '彙整媒體訓練';
    } else {
      const event = events.find(e => e.id === eventId);
      if (event) {
        eventName = event.name;
        document.getElementById('event-title').textContent = event.name + ' — 媒體訓練';
        document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練';
        document.title = event.name + ' — 媒體訓練';
      }
    }
  } catch(e) {}

  document.getElementById('loading').style.display = 'none';
}

function showEventSelector(events) {
  // 隱藏進度條與開始按鈕，顯示選擇器
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('start-area').style.display = 'none';

  const container = document.createElement('div');
  container.style.cssText = 'padding:20px 16px;';

  const title = document.createElement('p');
  title.style.cssText = 'font-size:0.9rem;color:#7c3a0a;margin-bottom:14px;font-weight:600;';
  title.textContent = '請選擇要進行訓練的活動：';
  container.appendChild(title);

  // 彙整選項
  const allBtn = createSelectorBtn('🗂 彙整訓練（全部活動）', 'all', '涵蓋所有進行中活動的知識庫');
  container.appendChild(allBtn);

  // 各活動選項
  events.forEach(ev => {
    const btn = createSelectorBtn('📋 ' + ev.name, ev.id, '');
    container.appendChild(btn);
  });

  // 插入在 info-card 之後
  document.getElementById('info-card').insertAdjacentElement('afterend', container);
}

function createSelectorBtn(label, id, desc) {
  const btn = document.createElement('button');
  btn.style.cssText = 'display:block;width:100%;text-align:left;background:white;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin-bottom:10px;cursor:pointer;font-family:var(--font);font-size:0.9rem;font-weight:600;transition:all 0.15s;';
  btn.textContent = label;
  if (desc) {
    const sub = document.createElement('div');
    sub.style.cssText = 'font-size:0.76rem;font-weight:400;color:#6b7280;margin-top:3px;';
    sub.textContent = desc;
    btn.appendChild(sub);
  }
  btn.onmouseover = () => { btn.style.borderColor = 'var(--primary)'; btn.style.background = 'var(--primary-light)'; };
  btn.onmouseout = () => { btn.style.borderColor = '#e5e7eb'; btn.style.background = 'white'; };
  btn.onclick = () => selectEvent(id);
  return btn;
}

function selectEvent(id) {
  eventId = id;
  // 更新 URL（不重新整理）
  history.replaceState(null, '', '/training?id=' + encodeURIComponent(id));
  // 移除選擇器，顯示進度條＋開始
  const sel = document.getElementById('info-card').nextElementSibling;
  if (sel && sel.tagName === 'DIV') sel.remove();
  document.getElementById('progress-bar').style.display = '';
  document.getElementById('start-area').style.display = 'flex';

  if (id === 'all') {
    eventName = '工研院彙整媒體訓練';
    document.getElementById('event-title').textContent = '彙整媒體訓練 — 全部活動';
    document.getElementById('event-subtitle').textContent = 'AI 記者實戰演練（綜合所有活動）';
  }
}

document.getElementById('start-btn').addEventListener('click', startTraining);
document.getElementById('restart-btn').addEventListener('click', () => {
  reporterHist = [];
  questionCount = 0;
  sessionScores = [];
  voiceAnswerCount = 0;
  if (recording) stopRecording(true); else cleanupRecording();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('end-avg').textContent = '';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('input-area').style.display = 'none';
  document.getElementById('start-area').style.display = 'flex';
  updateProgress();
});

async function startTraining() {
  sessionScores = [];
  voiceAnswerCount = 0;
  rememberTrainee(document.getElementById('trainee-input').value.trim());
  document.getElementById('start-area').style.display = 'none';
  document.getElementById('input-area').style.display = 'flex';
  await askNextQuestion();
}

async function askNextQuestion() {
  isWaiting = true;
  awaitingAnswer = false;
  lockAnswering();

  showTyping('reporter');

  try {
    const res = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: reporterHist,
        event_id: eventId,
        mode: 'reporter',
        spoken: answerMode === 'voice',
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined
      })
    });
    const data = await res.json();
    removeTyping();

    const reply = data.reply || data.error || '（無法取得問題）';
    reporterHist.push({ role: 'assistant', content: reply });
    addReporterMsg(reply);

    questionCount++;
    updateProgress();

    enableAnswering();
  } catch(e) {
    removeTyping();
    addSystemMsg('連線錯誤，請重新整理後再試。');
  }

  isWaiting = false;
}

/**
 * 送出一題的回答。
 * @param {string} [rawText] 回答內容；省略就從打字框拿（打字模式）
 * @param {number} [seconds] 用講的時候，這段講了幾秒——評分要用
 * @param {boolean} [viaVoice] 這題是不是用講的
 */
async function submitAnswer(rawText, seconds = 0, viaVoice = false) {
  if (isWaiting || !awaitingAnswer) return;
  const typeBox = document.getElementById('user-input');
  const ans = String(rawText ?? typeBox.value).trim();
  if (!ans) return;

  typeBox.value = '';
  typeBox.style.height = 'auto';
  lockAnswering();
  awaitingAnswer = false;
  isWaiting = true;
  if (viaVoice) voiceAnswerCount++;

  addUserMsg(ans, viaVoice ? seconds : 0);
  reporterHist.push({ role: 'user', content: ans });

  // 評分
  showTyping('eval');

  try {
    const evalRes = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: reporterHist,
        event_id: eventId,
        mode: 'evaluate',
        spoken: viaVoice,
        duration: viaVoice ? seconds : undefined,
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined
      })
    });
    const evalData = await evalRes.json();
    removeTyping();

    const evalText = evalData.reply || evalData.error || '（無法取得評分）';
    reporterHist.push({ role: 'assistant', content: evalText });

    // 解析評分中的下一題（分隔線後的內容）。
    // 模型偶爾會把分隔線寫成簡體「---下一题---」或改成全形破折號，寬鬆一點比較保險：
    // 同一行、前後至少兩個破折號、中間含「下一」就算數。
    const parts = evalText.split(/[-—–─]{2,}[^\n]*下一[^\n]*[-—–─]{2,}/);
    const evalPart = parts[0].trim();
    const nextQ = parts[1]?.trim();

    // 抓「整體分數：X / 10」——prompt 裡要求這個格式，但寬鬆比對比較保險
    // （半形/全形冒號都收，數字可能帶小數）。抓不到就記 null：這一題不算進平均，
    // 但仍然算完成了一題（question_count 仍要涵蓋它，見 logSession()）。
    const scoreMatch = evalPart.match(/整體分數[：:]\s*(\d+(?:\.\d+)?)\s*\/\s*10/);
    const score = scoreMatch ? Math.max(0, Math.min(10, Number(scoreMatch[1]))) : null;
    sessionScores.push(score);

    addEvalMsg(evalPart, score);

    if (questionCount >= MAX_Q) {
      // 訓練結束
      setTimeout(() => {
        document.getElementById('input-area').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        updateProgress();
      }, 800);
      logSession();
    } else if (!nextQ) {
      // 評分沒照格式附上下一題。以前這裡會直接判定訓練結束，五題變兩題就沒了；
      // 改成回頭用記者模式補問一題，格式漂移不該讓整場訓練提早收掉。
      reporterHist.push({ role: 'user', content: '（訓練系統）請直接提出下一個問題，只要問題本身，不要任何前綴或說明。' });
      await askNextQuestion();
    } else {
      // 繼續下一題（把下一題加入對話）
      reporterHist.push({ role: 'assistant', content: nextQ });
      addReporterMsg(nextQ);

      questionCount++;
      updateProgress();

      enableAnswering();
    }
  } catch(e) {
    removeTyping();
    addSystemMsg('評分失敗，請稍後再試。');
  }

  isWaiting = false;
}

// ── 語音作答 ─────────────────────────────────────────────────────────
// 主管的原話：「真實記者會上沒有人在打字」。這一段負責把「按一下講、再按一下停」
// 變成一份逐字稿，交給 submitAnswer() 送去評分。
//
// 三層退路，任何一層垮掉都還練得完這一場：
//   ① 錄音上傳後端轉寫（品質最好，專有名詞會用活動知識庫當提示）
//   ② 後端沒設定 STT／轉寫失敗 → 用瀏覽器邊講邊出的即時辨識結果頂上
//   ③ 麥克風根本拿不到（沒權限、沒裝置、不是 HTTPS）→ 退回打字，並說清楚原因
//
// ⚠️ 不管哪一層，逐字稿都會先攤在主管眼前讓他改過再送出。辨識一定會有錯字，
// 尤其是專有名詞；沒得改的話，他會看到 AI 在評一段他沒講過的話。

function fmtTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

/** 這一段講到哪個區間了。切分方式跟 api/training.js 的 speechZone() 一樣。 */
function zoneOf(sec) {
  if (sec < TARGET_MIN_SEC) return 'short';
  if (sec <= TARGET_MAX_SEC) return 'target';
  if (sec <= TOO_LONG_SEC) return 'long';
  return 'toolong';
}

// 講到第幾秒就換一次顏色跟提示語。這是這一版真正要求主管的事：不是講完之後
// 在評語裡被告知「你講太久」，而是講到 60 秒的當下就看到催收尾的訊號——
// 真實的媒體訓練師就是在旁邊比手勢，不是事後寫檢討報告。
const ZONE_HINT = {
  short: `目標：${TARGET_MAX_SEC / 60} 分鐘內講完重點`,
  target: '重點時間，可以準備收尾了',
  long: `已經超過 ${TARGET_MAX_SEC} 秒，請收尾`,
  toolong: '太長了，記者會抓不到重點',
};

function updateTimeZone(sec) {
  const status = document.getElementById('rec-status');
  const zone = zoneOf(sec);
  if (status.dataset.zone === zone) return;   // 只在跨區的那一刻動 DOM
  status.dataset.zone = zone;
  status.classList.remove('zone-short', 'zone-target', 'zone-long', 'zone-toolong');
  status.classList.add('zone-' + zone);
  // 沒收到聲音的警告優先，不要被時間提示蓋掉
  if (!status.classList.contains('silent')) {
    document.getElementById('rec-hint').textContent = ZONE_HINT[zone];
  }
}

function showPane(name) {
  document.getElementById('voice-pane').style.display = name === 'voice' ? 'flex' : 'none';
  document.getElementById('confirm-pane').style.display = name === 'confirm' ? 'flex' : 'none';
  document.getElementById('type-pane').style.display = name === 'type' ? 'flex' : 'none';
}

function setVoiceNote(text, warn) {
  const el = document.getElementById('voice-note');
  el.textContent = text || '';
  el.className = warn ? 'warn' : '';
}

/** 瀏覽器到底能不能錄音。非 HTTPS 時 navigator.mediaDevices 根本不存在。 */
function canRecord() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}

// MediaRecorder 各家吃的格式不一樣：Chrome／Edge／Android 給 webm（opus），
// Safari／iOS 給 mp4（aac）。挑第一個這台機器真的支援的，挑不到就讓瀏覽器自己決定。
function pickRecMime() {
  const prefer = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (const t of prefer) {
    try { if (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t; } catch (e) {}
  }
  return '';
}

function setAnswerMode(mode, remember = true) {
  answerMode = mode === 'type' ? 'type' : 'voice';
  if (remember) { try { localStorage.setItem(ANSWER_MODE_LS_KEY, answerMode); } catch (e) {} }
  showPane(answerMode === 'voice' ? 'voice' : 'type');
  if (awaitingAnswer) enableAnswering();
}

/** 這一題可以作答了：依目前模式打開麥克風按鈕或打字框。 */
function enableAnswering() {
  awaitingAnswer = true;
  if (answerMode === 'voice') {
    showPane('voice');
    const btn = document.getElementById('mic-btn');
    btn.disabled = false;
    btn.classList.remove('recording');
    document.getElementById('mic-label').textContent = '按一下開始講';
    document.getElementById('rec-status').style.display = 'none';
    document.getElementById('live-caption').style.display = 'none';
  } else {
    showPane('type');
    const box = document.getElementById('user-input');
    box.disabled = false;
    box.focus();
    document.getElementById('send-btn').disabled = false;
  }
}

/** 送出之後、AI 還在想的時候：把所有作答入口關起來，免得重複送出。 */
function lockAnswering() {
  document.getElementById('mic-btn').disabled = true;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('user-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('rec-status').style.display = 'none';
  document.getElementById('live-caption').style.display = 'none';
  setVoiceNote('');
  showPane(answerMode === 'voice' ? 'voice' : 'type');
}

// ── 瀏覽器即時辨識（只當作視覺回饋＋後端轉寫失敗時的備胎）────────────
function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  try {
    const rec = new SR();
    rec.lang = 'zh-TW';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      liveInterim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) liveFinal += t;
        else liveInterim += t;
      }
      const cap = document.getElementById('live-caption');
      cap.style.display = 'block';
      cap.textContent = (liveFinal + liveInterim) || '（聽著…）';
      cap.scrollTop = cap.scrollHeight;
    };
    // ⚠️ Chrome 講到一半停頓幾秒就會自己 onend，continuous=true 也擋不住。
    // 還在錄音的話要馬上接回去，不然後半段整個不見。
    rec.onend = () => { if (recording) { try { rec.start(); } catch (e) {} } };
    rec.onerror = () => {}; // 辨識掛掉不影響錄音，後端轉寫才是主力
    return rec;
  } catch (e) { return null; }
}

// ── 音量監測 ─────────────────────────────────────────────────────────
// 「按了錄音但其實沒收到聲音」是這種介面最典型的失敗：系統把麥克風靜音了、
// 選到一支沒接的裝置，MediaRecorder 照樣產出一個有長度、內容全空的檔案，
// 完全不會報錯。畫面上那條會動的量表，就是唯一的徵兆。
function monitorLevel(stream) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);

    const tick = () => {
      if (!recording || !analyser) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      if (rms > peakLevel) peakLevel = rms;
      document.getElementById('level-fill').style.width = Math.min(100, rms * 320) + '%';
      levelRaf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { /* 量不到就算了，不影響錄音本身 */ }
}

async function startRecording() {
  if (recording || isWaiting || !awaitingAnswer) return;

  if (!canRecord()) {
    setAnswerMode('type');
    addSystemMsg(location.protocol === 'https:' || location.hostname === 'localhost'
      ? '這個瀏覽器不支援錄音，已改用打字作答。'
      : '錄音需要 HTTPS 才能使用，已改用打字作答。');
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setAnswerMode('type');
    addSystemMsg(denied
      ? '瀏覽器擋住了麥克風權限。請在網址列左邊的圖示允許麥克風後重試，先用打字也可以。'
      : '找不到可以用的麥克風，已改用打字作答。');
    return;
  }

  mediaStream = stream;
  recChunks = [];
  peakLevel = 0;
  liveFinal = '';
  liveInterim = '';
  recStartedAt = Date.now();
  recording = true;

  const mime = pickRecMime();
  try {
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream);
  }
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const seconds = (Date.now() - recStartedAt) / 1000;
    const type = (mediaRecorder && mediaRecorder.mimeType) || mime || 'audio/webm';
    const blob = recChunks.length ? new Blob(recChunks, { type }) : null;
    cleanupRecording();
    finishRecording(blob, type, seconds);
  };
  mediaRecorder.start(1000); // 每秒切一塊，長回答也不會整段卡在記憶體裡

  speechRec = setupSpeechRecognition();
  if (speechRec) { try { speechRec.start(); } catch (e) {} }
  monitorLevel(stream);

  // UI：進入錄音中
  const btn = document.getElementById('mic-btn');
  btn.classList.add('recording');
  document.getElementById('mic-label').textContent = '講完了，按這裡停止';
  const status = document.getElementById('rec-status');
  status.style.display = 'flex';
  status.classList.remove('silent');
  document.getElementById('rec-time').textContent = '0:00';
  document.getElementById('rec-target').textContent =
    `目標 ${fmtTime(TARGET_MIN_SEC)}–${fmtTime(TARGET_MAX_SEC)}`;
  status.classList.remove('zone-short', 'zone-target', 'zone-long', 'zone-toolong');
  delete status.dataset.zone;
  updateTimeZone(0);
  document.getElementById('level-fill').style.width = '0%';
  setVoiceNote('');

  recTimer = setInterval(() => {
    const sec = (Date.now() - recStartedAt) / 1000;
    document.getElementById('rec-time').textContent = fmtTime(sec);
    updateTimeZone(sec);
    // 講了 5 秒還完全沒有音量＝十之八九麥克風沒收到，當下就要講，不要等他講完。
    // ⚠️ 這條要壓過時間提示：麥克風沒開，比講太久嚴重得多。
    if (sec > 5 && peakLevel < SILENT_PEAK) {
      status.classList.add('silent');
      document.getElementById('rec-hint').textContent = '幾乎沒收到聲音，請確認麥克風';
    }
  }, 250);

  autoStopTimer = setTimeout(() => {
    if (recording) {
      setVoiceNote(`單題錄音上限 ${Math.round(MAX_REC_SECONDS / 60 * 10) / 10} 分鐘，已自動停止。`, true);
      stopRecording();
    }
  }, MAX_REC_SECONDS * 1000);
}

function stopRecording(abandon = false) {
  if (!recording) return;
  abandonRecording = !!abandon;
  recording = false;
  try { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').disabled = true;
  document.getElementById('mic-label').textContent = '辨識中…';
}

/** 錄音相關資源一律收乾淨——麥克風沒關掉，分頁上的紅點會一直亮著。 */
function cleanupRecording() {
  clearInterval(recTimer); recTimer = null;
  clearTimeout(autoStopTimer); autoStopTimer = null;
  if (levelRaf) { cancelAnimationFrame(levelRaf); levelRaf = null; }
  if (speechRec) { try { speechRec.stop(); } catch (e) {} speechRec = null; }
  if (analyser) { try { analyser.disconnect(); } catch (e) {} analyser = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} }); mediaStream = null; }
  document.getElementById('rec-status').style.display = 'none';
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

/** 把音檔丟給後端轉寫。回 { text, note } —— note 是要讓主管知道的狀況說明。 */
async function transcribeBlob(blob, mime) {
  const audio = await blobToBase64(blob);
  const res = await fetch('/api/training', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mode: 'transcribe',
      event_id: eventId,
      audio,
      mime,
      code: TRAINING_CODE || undefined,
      password: TRAINING_PWD || undefined,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.text) return { text: data.text };
  if (res.ok && data.empty) return { text: '', note: '這段錄音裡沒有聽到說話的內容。' };
  // fallback 代表後端沒設定轉寫服務或轉寫壞了——瀏覽器邊講邊出的那份頂上來，
  // 讓主管不用重講一次。品質會差一點，所以要講清楚為什麼。
  if (data.fallback === 'browser') return { text: '', note: '伺服器的語音辨識沒有啟用，以下是瀏覽器聽到的版本，請確認一下。' };
  return { text: '', note: data.error || '語音辨識失敗，請確認內容或改用打字。' };
}

async function finishRecording(blob, mime, seconds) {
  // 使用者自己中斷的（改用打字、重新開始一場），就到此為止——這段錄音不送去
  // 辨識，也不要跳出確認畫面蓋掉他剛切過去的介面。
  if (abandonRecording) { abandonRecording = false; return; }
  pendingSeconds = seconds;
  const live = (liveFinal + liveInterim).trim();

  let text = '';
  let note = '';

  if (seconds < 1.2) {
    note = '這段太短了（不到 1 秒），請按「重錄」再講一次。';
  } else if (blob && blob.size > 2000) {
    try {
      const r = await transcribeBlob(blob, mime);
      text = r.text || '';
      note = r.note || '';
    } catch (e) {
      note = '語音辨識連線失敗，以下是瀏覽器聽到的版本，請確認一下。';
    }
  } else {
    note = '沒有錄到聲音，請確認麥克風後重錄。';
  }

  // 後端沒給逐字稿就用瀏覽器那份；兩份都沒有就留空框讓他自己補或重錄——
  // 卡在這裡不給任何出路，才是最糟的情況。
  if (!text && live) { text = live; if (!note) note = '以下是瀏覽器聽到的版本，請確認一下。'; }
  if (!text && peakLevel < SILENT_PEAK && seconds >= 1.2) {
    note = '整段幾乎沒有音量，麥克風可能沒有開。請按「重錄」，或直接在下面打字。';
  }
  showTranscript(text, note);
}

function showTranscript(text, note) {
  showPane('confirm');
  const box = document.getElementById('transcript-box');
  box.value = text || '';
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 160) + 'px';
  const zone = zoneOf(pendingSeconds);
  const ZONE_TAIL = {
    short: '，比目標短——重點講完就好，短不是問題',
    target: `，落在目標 ${fmtTime(TARGET_MIN_SEC)}–${fmtTime(TARGET_MAX_SEC)} 內 👍`,
    long: `，超過目標的 ${TARGET_MAX_SEC} 秒`,
    toolong: `，比目標的 ${TARGET_MAX_SEC} 秒久了不少`,
  };
  document.getElementById('confirm-head-text').textContent = note
    ? note
    : `聽到的是這樣（講了 ${fmtTime(pendingSeconds)}${ZONE_TAIL[zone] || ''}），送出前可以直接改`;
  document.getElementById('confirm-send-btn').disabled = !String(box.value).trim();
  box.focus();
}

function sendTranscript() {
  const text = document.getElementById('transcript-box').value.trim();
  if (!text) return;
  submitAnswer(text, pendingSeconds, true);
}

function redoRecording() {
  document.getElementById('transcript-box').value = '';
  pendingSeconds = 0;
  enableAnswering();
}

// 訓練走到終畫面才呼叫（見 submitAnswer() 裡 questionCount >= MAX_Q 那段）——中途
// 離開的不記，不然「演練場次」會被答一題就走的雜訊灌水。fire-and-forget：不 await
// 結果來擋終畫面顯示，訓練本身已經結束，紀錄寫不寫得進去不該讓受訓者等待或看到
// 錯誤畫面；寫成功的話，把後端重新算好的平均分（不是前端自己算的那份）補上去。
async function logSession() {
  if (!sessionScores.length) return; // 一題都沒有（理論上不會發生，防呆）
  try {
    const res = await fetch('/api/training', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'log_session',
        event_id: eventId,
        trainee: document.getElementById('trainee-input').value.trim(),
        scores: sessionScores,
        voice_answers: voiceAnswerCount,
        code: TRAINING_CODE || undefined,
        password: TRAINING_PWD || undefined
      })
    });
    const data = await res.json();
    if (data.success && data.avg_score !== '' && data.avg_score != null) {
      const via = voiceAnswerCount ? `（${voiceAnswerCount} / ${sessionScores.length} 題用講的）` : '';
      document.getElementById('end-avg').textContent = `本次平均分：${data.avg_score} / 10 ${via}`.trim();
    }
  } catch(e) {
    console.error('訓練紀錄寫入失敗（不影響剛剛的訓練結果）:', e);
  }
}

function updateProgress() {
  const pct = Math.min((questionCount / MAX_Q) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `${Math.min(questionCount, MAX_Q)} / ${MAX_Q} 題`;
}

// 訊息渲染
function addReporterMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg reporter';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-microphone"></i></div>
    <div class="bubble">
      <span class="label">AI 記者</span><br>
      ${escHtml(text)}
    </div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addUserMsg(text, seconds) {
  const el = document.createElement('div');
  el.className = 'msg user';
  // 講了多久是真實媒體訓練會看的數字（電視新聞一則受訪片段大約 8–15 秒），
  // 貼在自己的回答下面，比只寫在評語裡更有感。
  const over = seconds > TARGET_MAX_SEC;
  const meta = seconds
    ? `<span class="meta${over ? ' over' : ''}"><i class="ti ti-microphone"></i> 用講的 · ${fmtTime(seconds)}`
      + `${over ? `（超過目標 ${TARGET_MAX_SEC} 秒）` : ''}</span>`
    : '';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-user"></i></div>
    <div class="bubble">${escHtml(text)}${meta}</div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addEvalMsg(text, score) {
  const el = document.createElement('div');
  el.className = 'msg eval';
  // 分數已經在內文的「整體分數：X / 10」那行了，這裡另外用徽章放大呈現一次——
  // 內文是完整記錄，徽章是讓人一眼掃過去就抓到重點，不衝突。
  const badge = (score != null) ? `<span class="score-badge">${score}<span class="of10">/10</span></span><br>` : '';
  el.innerHTML = `
    <div class="avatar"><i class="ti ti-star"></i></div>
    <div class="bubble">
      <span class="eval-label">訓練師評分</span><br>
      ${badge}${escHtml(text)}
    </div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addSystemMsg(text) {
  const el = document.createElement('div');
  el.style.cssText = 'text-align:center;color:#9ca3af;font-size:0.82rem;padding:8px';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
}

function showTyping(type) {
  const el = document.createElement('div');
  el.className = `msg ${type === 'eval' ? 'eval' : 'reporter'}`;
  el.id = 'typing';
  const icon = type === 'eval' ? 'ti-star' : 'ti-microphone';
  el.innerHTML = `
    <div class="avatar"><i class="ti ${icon}"></i></div>
    <div class="bubble">
      <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
    </div>`;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

// ── 語音作答的事件綁定 ──────────────────────────────────────────────
document.getElementById('mic-btn').addEventListener('click', () => {
  if (recording) stopRecording(); else startRecording();
});
document.getElementById('switch-to-type').addEventListener('click', () => {
  if (recording) stopRecording(true);
  setAnswerMode('type');
});
document.getElementById('switch-to-voice').addEventListener('click', () => setAnswerMode('voice'));
document.getElementById('redo-btn').addEventListener('click', redoRecording);
document.getElementById('confirm-send-btn').addEventListener('click', sendTranscript);
document.getElementById('transcript-box').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  document.getElementById('confirm-send-btn').disabled = !this.value.trim();
});
document.getElementById('transcript-box').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTranscript(); }
});
// 離開頁面時把麥克風關掉，不然分頁上的錄音紅點會一直亮著
window.addEventListener('pagehide', () => { recording = false; cleanupRecording(); });

// 輸入事件
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return; // 中文輸入法選字時的 Enter，不當作送出
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitAnswer(); }
});
document.getElementById('send-btn').addEventListener('click', submitAnswer);
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

init();
</script>
