<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 網址上帶著 LINE 身分簽章與編輯碼，不要外流給任何第三方網站 -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>媒體報名</title>
<!--
  媒體報名頁（批次 88）。給記者從邀請函、米亞聊天室點進來填的。
  設計原則：一頁做完、手機優先、不需要 LINE、不需要登入、不載入任何外部資源（icon 用內嵌 SVG／emoji，
  公司網路擋 CDN 也不影響）。LINE 只在「報名完成」之後才問，而且明講不加也完成了。
  資料進 Google 試算表的 registrations 分頁，後台看 /registrations。API 在 api/events.js 的 reg_ 系列 action。
-->
<style>
  :root {
    --primary: #0F9E7A; --primary-dark: #0a7a60; --primary-light: rgba(15,158,122,0.09);
    --text: #1a1a2e; --muted: #6b7280; --bg: #f0f7f5; --card: #ffffff; --border: #dfe5e3;
    --danger: #dc2626; --line: #06C755; --radius: 14px;
    --font: 'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 16px; }
  a { color: var(--primary-dark); }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 120px; }

  /* 頁首 */
  header.hero { background: linear-gradient(135deg, #0a7a60 0%, #0F9E7A 100%); color: #fff; padding: 26px 16px 30px; }
  header.hero .in { max-width: 620px; margin: 0 auto; }
  .hero .tag { font-size: .8rem; opacity: .85; letter-spacing: .06em; }
  .hero h1 { font-size: 1.45rem; line-height: 1.35; margin: 4px 0 8px; }
  .hero .when { font-size: .92rem; opacity: .95; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; margin-top: 14px; }
  .card h2 { font-size: 1rem; margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
  .card h2 .step { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .8rem; align-items: center; justify-content: center; flex: none; transform: translateY(-1px); }
  .intro { white-space: pre-line; font-size: .95rem; color: #374151; }
  .banner { border-radius: 10px; padding: 10px 12px; font-size: .88rem; margin-top: 14px; }
  .banner.warn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
  .banner.info { background: var(--primary-light); border: 1px solid rgba(15,158,122,.25); color: var(--primary-dark); }
  .banner.err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .banner button { background: none; border: none; color: inherit; text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }

  /* 欄位 */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label.lab { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 5px; }
  .req { color: var(--danger); margin-left: 2px; }
  .field input[type=text], .field input[type=email], .field input[type=tel], .field select {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 13px; border: 1.5px solid var(--border);
    border-radius: 10px; background: #fff; outline: none; -webkit-appearance: none; appearance: none;
  }
  .field select { background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%), linear-gradient(135deg, #6b7280 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .field.bad input, .field.bad select { border-color: var(--danger); }
  .msg { color: var(--danger); font-size: .82rem; margin-top: 4px; display: none; }
  .field.bad .msg, .sess-msg.show { display: block; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  /* 場次 */
  .day { margin-top: 14px; }
  .day:first-of-type { margin-top: 4px; }
  .day-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
  .day-head b { font-size: .95rem; }
  .day-head button { background: none; border: none; color: var(--primary-dark); font: inherit; font-size: .85rem; cursor: pointer; padding: 6px 4px; }
  .sess { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .sess input { position: absolute; opacity: 0; pointer-events: none; }
  .sess .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #c5cdca; flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; line-height: 1; }
  .sess.on { border-color: var(--primary); background: var(--primary-light); }
  .sess.on .box { background: var(--primary); border-color: var(--primary); }
  .sess.on .box::after { content: "✓"; }
  .sess input:focus-visible ~ .box { outline: 3px solid rgba(15,158,122,.35); outline-offset: 2px; }
  .sess.off { cursor: not-allowed; background: #f6f7f7; }
  .sess.off .s-title, .sess.off .s-time { color: #9ca3af; }
  .s-main { flex: 1; min-width: 0; }
  .s-top { font-size: .82rem; color: var(--muted); }
  .s-top b { color: var(--primary-dark); margin-right: 6px; }
  .s-title { display: block; font-weight: 600; line-height: 1.4; margin-top: 1px; }
  .s-meta { display: block; font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .s-badge { font-size: .72rem; background: #e5e7eb; color: #4b5563; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
  .s-more { font-size: .8rem; flex: none; align-self: center; padding: 6px 4px; }
  .sess-msg { display: none; color: var(--danger); font-size: .82rem; margin-top: 6px; }
  .extras .opt { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: .95rem; }
  .extras .opt:first-of-type { border-top: none; padding-top: 0; }
  .extras .opt input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--primary); flex: none; }
  .extras .opt.num select { width: 84px; padding: 8px 30px 8px 10px; }
  .extras .opt span.t { flex: 1; }
  .privacy { font-size: .78rem; color: var(--muted); line-height: 1.7; }

  /* 底部送出列 */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 20; }
  .bar .in { max-width: 620px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .bar .sum { flex: 1; font-size: .9rem; color: var(--muted); line-height: 1.3; }
  .bar .sum b { color: var(--primary-dark); font-size: 1.05rem; }
  .btn { font: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 13px 22px; cursor: pointer; background: var(--primary); color: #fff; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn.line { background: var(--line); }
  .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--border); font-weight: 600; }
  .btn.block { width: 100%; }
  .linkbtn { background: none; border: none; color: var(--muted); font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; padding: 8px 0; }

  /* 完成頁 */
  .done { text-align: center; padding-top: 26px; }
  .done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .done h2 { font-size: 1.3rem; justify-content: center; margin-bottom: 4px; }
  .done .who { color: var(--muted); font-size: .92rem; }
  .sum-list { text-align: left; margin-top: 16px; }
  .sum-list li { list-style: none; padding: 9px 0; border-top: 1px solid var(--border); font-size: .92rem; }
  .sum-list li:first-child { border-top: none; }
  .sum-list b { color: var(--primary-dark); margin-right: 6px; }
  .regno { font-size: .78rem; color: var(--muted); margin-top: 10px; }
  footer.contact { margin-top: 22px; font-size: .85rem; color: var(--muted); white-space: pre-line; text-align: center; }
  .center { text-align: center; }
  .spinner { text-align: center; color: var(--muted); padding: 60px 0; }
  .choices a { display: block; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 10px; text-decoration: none; color: var(--text); font-weight: 600; background: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="hero"><div class="in">
  <div class="tag">工研院 · 媒體報名</div>
  <h1 id="h-title">媒體報名</h1>
  <div class="when" id="h-when"></div>
  <div class="when" id="h-where"></div>
</div></header>

<main class="wrap" id="app"><div class="spinner">載入中…</div></main>

<script>
'use strict';
const qs = new URLSearchParams(location.search);
const CID = (qs.get('c') || '').trim();
const LINE_TOKEN = qs.get('u') || '';          // 從米亞聊天室點進來時帶的身分簽章
let EDIT_TOKEN = qs.get('t') || '';            // 修改連結帶的編輯碼
const API = '/api/events';
const loadedAt = Date.now();

let campaign = null;
let editing = null;      // 修改模式：{ reg_id, ... }
let submitting = false;

/* ── 小工具 ─────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
// localStorage 在部分 App 內建瀏覽器／無痕模式會丟例外，一律包起來，讀不到就當沒有。
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const storeKey = () => `itri-reg:${campaign ? campaign.id : CID}`;
async function api(action, body) {
  const opt = body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...body }) }
    : {};
  const url = body ? API : `${API}?action=${action}&${new URLSearchParams(arguments[2] || {})}`;
  const res = await fetch(url, opt);
  let data = {};
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}
// 聯絡人文字：換行照舊，Email／電話變成可點的連結
function linkify(text) {
  const frag = document.createDocumentFragment();
  const re = /([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|(0\d{1,2}-?\d{3,4}-?\d{3,4}(?:\s*(?:分機|#|轉)\s*\d+)?|09\d{2}-?\d{3}-?\d{3})/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const a = document.createElement('a');
    a.textContent = m[0];
    a.href = m[1] ? `mailto:${m[1]}` : `tel:${m[2].replace(/[^\d+]/g, '')}`;
    frag.append(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
const digitsOnly = (s) => String(s || '').replace(/[^\d+]/g, '');

/* ── 進場 ───────────────────────────────────────────── */
async function init() {
  const r = await api('reg_config', null, CID ? { c: CID } : {}).catch(() => null);
  const app = $('#app');
  app.replaceChildren();
  if (!r) return fail('網路好像不穩，請重新整理再試一次。');
  if (r.data.choices) return renderChoices(r.data.choices);
  if (!r.ok || !r.data.campaign) return fail(r.data.error || '找不到這個報名活動，請確認連結是否完整。');
  campaign = r.data.campaign;
  document.title = `${campaign.title}｜媒體報名`;
  $('#h-title').textContent = campaign.title;
  const live = campaign.sessions.filter((s) => !s.ended); // 辦完的場次自動不算
  if (live.length) {
    const a = live[0], z = live[live.length - 1];
    $('#h-when').textContent = `${a.date === z.date ? a.dateLabel : `${a.dateLabel} – ${z.dateLabel}`}　共 ${live.length} 場`;
  }
  // 活動地點（後台選填，跟 LINE 報名卡片同一個欄位）；textContent，同仁填什麼都不會被當成 HTML
  $('#h-where').textContent = campaign.venue ? `📍 ${campaign.venue}` : '';
  // 先看這台裝置有沒有報過（編輯碼存在瀏覽器裡）；沒帶編輯碼的連結也能直接進修改模式
  if (!EDIT_TOKEN) EDIT_TOKEN = store.get(storeKey()) || '';
  if (EDIT_TOKEN) {
    const g = await api('reg_get', null, { c: campaign.id, t: EDIT_TOKEN }).catch(() => null);
    if (g && g.ok && g.data.reg) { editing = g.data.reg; if (editing.status === 'cancelled') editing = null; }
    else { EDIT_TOKEN = ''; store.del(storeKey()); }
  }
  renderForm();
}
function fail(msg) {
  $('#app').replaceChildren(el('div', { class: 'card center' }, el('p', { text: msg }), el('p', { class: 'hint', style: 'margin-top:8px', text: '如需協助，請洽活動的媒體聯絡人。' })));
}
function renderChoices(list) {
  $('#h-title').textContent = '媒體報名';
  const box = el('div', { class: 'card choices' }, el('h2', { text: '請選擇要報名的活動' }));
  list.forEach((c) => box.append(el('a', { href: `/register?c=${encodeURIComponent(c.id)}`, text: c.title })));
  $('#app').replaceChildren(box);
}

/* ── 表單 ───────────────────────────────────────────── */
function renderForm(prefill) {
  const app = $('#app');
  const c = campaign;
  const pre = prefill || editing || {};
  const nodes = [];
  if (c.draft) nodes.push(el('div', { class: 'banner warn', text: '測試中：這一頁還沒有對外公開，送出的報名會標記為「測試」，不會列入統計，可以放心試填。' }));
  if (c.intro) nodes.push(el('div', { class: 'card' }, el('div', { class: 'intro', text: c.intro })));
  if (c.closed) {
    nodes.push(el('div', { class: 'card center' }, el('h2', { style: 'justify-content:center', text: '報名已截止' }),
      el('p', { class: 'hint', text: '如果還想採訪，請直接聯絡媒體聯絡人，我們盡量協助。' })));
    nodes.push(contactFooter());
    return app.replaceChildren(...nodes);
  }
  if (editing) {
    nodes.push(el('div', { class: 'banner info' }, `已載入您先前的報名（編號 ${editing.reg_id}），修改後按「儲存修改」即可。 `,
      el('button', { type: 'button', text: '這不是我，重新填寫', onclick: forgetMe })));
  }
  const form = el('form', { id: 'f', novalidate: true, autocomplete: 'on', onsubmit: onSubmit });
  // 蜜罐：人看不到，機器人會填
  form.append(el('div', { class: 'hp', 'aria-hidden': 'true' }, el('label', {}, '網站', el('input', { type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off' }))));

  form.append(el('div', { class: 'card' },
    el('h2', {}, el('span', { class: 'step', text: '1' }), '基本資料'),
    field('name', '姓名', 'text', { autocomplete: 'name', placeholder: '王小明', value: pre.name }),
    field('outlet', '媒體／服務單位', 'text', { autocomplete: 'organization', placeholder: '請填寫貴媒體或服務單位全名', value: pre.outlet }),
    field('email', 'Email', 'email', { autocomplete: 'email', inputmode: 'email', autocapitalize: 'off', placeholder: 'name@company.com', value: pre.email }, '請用公司信箱，主辦單位聯繫時使用'),
    field('phone', '手機號碼', 'tel', { autocomplete: 'tel', inputmode: 'tel', placeholder: '0912-345-678', value: pre.phone }, '活動當天現場聯繫會用到')));

  const sess = el('div', { class: 'card', id: 'sess-card' },
    el('h2', {}, el('span', { class: 'step', text: '2' }), '要採訪哪幾場？', el('span', { class: 'req', text: '*' })));
  // 已經辦完的場次自動從表單消失；只有這個人原本報了的才留著（鎖住、標「已結束」），
  // 紀錄不會因為他改別的欄位或別的場次被拿掉（伺服器端也會保留）。
  const shown = c.sessions.filter((s) => !s.ended || (pre.sessions || []).includes(s.code));
  const days = [...new Set(shown.map((s) => s.date))];
  days.forEach((d) => {
    const list = shown.filter((s) => s.date === d);
    const day = el('div', { class: 'day' }, el('div', { class: 'day-head' }, el('b', { text: list[0].dateLabel }),
      list.filter((s) => !s.disabled).length > 1 ? el('button', { type: 'button', text: '全選這天', onclick: () => toggleDay(list) }) : null));
    list.forEach((s) => day.append(sessionCard(s, (pre.sessions || []).includes(s.code))));
    sess.append(day);
  });
  sess.append(el('div', { class: 'sess-msg', id: 'sess-msg', role: 'alert' }));
  form.append(sess);

  if (c.options.length) {
    const ex = el('div', { class: 'card extras', id: 'extras' }, el('h2', {}, el('span', { class: 'step', text: '3' }), '其他需求（選填）'));
    c.options.forEach((o) => {
      const v = (pre.options || {})[o.key];
      const row = el('label', { class: 'opt' + (o.type === 'number' ? ' num' : ''), 'data-key': o.key, 'data-sessions': o.sessions.join(',') });
      if (o.type === 'number') {
        const sel = el('select', { name: `opt_${o.key}` }, ...[...Array(10).keys()].map((n) => el('option', { value: String(n), text: n === 0 ? '無' : `${n} 人` })));
        sel.value = String(parseInt(v, 10) || 0);
        row.append(el('span', { class: 't', text: o.label }), sel);
      } else {
        row.append(el('input', { type: 'checkbox', name: `opt_${o.key}`, checked: v === '1' }), el('span', { class: 't', text: o.label }));
      }
      ex.append(row);
    });
    form.append(ex);
  }

  // 個資告知：後台有填才顯示（預設不放）
  if (c.privacy) form.append(el('div', { class: 'card' }, el('p', { class: 'privacy', text: c.privacy })));
  form.append(el('div', { class: 'bar' }, el('div', { class: 'in' },
    el('div', { class: 'sum', id: 'sum' }),
    el('button', { class: 'btn', id: 'go', type: 'submit', text: editing ? '儲存修改' : '送出報名' }))));
  nodes.push(form);
  if (editing) nodes.push(el('div', { class: 'center', style: 'margin-top:14px' }, el('button', { type: 'button', class: 'linkbtn', text: '取消整筆報名', onclick: onCancelReg })));
  nodes.push(contactFooter());
  app.replaceChildren(...nodes);
  syncUi();
}
function field(name, label, type, attrs, hint) {
  const input = el('input', { type, name, id: `f-${name}`, maxlength: name === 'email' ? 100 : name === 'phone' ? 20 : 60, ...attrs });
  if (attrs.value) input.value = attrs.value;
  // 開始改的那一刻就把該欄的紅字收掉——不用等到下次按送出才知道改對了
  input.addEventListener('input', () => setErr(name, ''));
  return el('div', { class: 'field', 'data-f': name },
    el('label', { class: 'lab', for: `f-${name}` }, label, el('span', { class: 'req', text: '*' })),
    input, hint ? el('div', { class: 'hint', text: hint }) : null, el('div', { class: 'msg', role: 'alert' }));
}
function sessionCard(s, on) {
  const cb = el('input', { type: 'checkbox', name: 'sess', value: s.code, disabled: ((s.disabled && !on) || s.ended) ? true : null });
  cb.checked = !!on;
  const card = el('label', { class: 'sess' + ((s.disabled && !on) || s.ended ? ' off' : ''), 'data-code': s.code },
    cb, el('span', { class: 'box' }),
    el('span', { class: 's-main' },
      el('span', { class: 's-top' }, el('b', { text: s.code }), s.time, s.disabled ? el('span', { class: 's-badge', text: s.ended ? '已結束' : s.status === 'full' ? '額滿' : '已截止' }) : null),
      el('span', { class: 's-title', text: s.title }),
      (s.room || s.note) ? el('span', { class: 's-meta', text: [s.room, s.note].filter(Boolean).join('・') }) : null),
    s.url ? el('a', { class: 's-more', href: s.url, target: '_blank', rel: 'noopener', text: '詳細', onclick: (e) => e.stopPropagation() }) : null);
  cb.addEventListener('change', syncUi);
  return card;
}
function selectedCodes() { return [...document.querySelectorAll('input[name=sess]:checked')].map((i) => i.value); }
function toggleDay(list) {
  const boxes = list.map((s) => $(`input[name=sess][value="${s.code}"]`)).filter((b) => b && !b.disabled);
  const all = boxes.every((b) => b.checked);
  boxes.forEach((b) => { b.checked = !all; });
  syncUi();
}
function syncUi() {
  const codes = selectedCodes();
  document.querySelectorAll('.sess').forEach((n) => n.classList.toggle('on', !!$('input', n).checked));
  const sum = $('#sum');
  if (sum) sum.replaceChildren(codes.length ? el('span', {}, '已選 ', el('b', { text: String(codes.length) }), ' 場') : el('span', { text: '請勾選要採訪的場次' }));
  document.querySelectorAll('#extras .opt').forEach((row) => {
    const need = (row.dataset.sessions || '').split(',').filter(Boolean);
    row.hidden = need.length ? !need.some((c) => codes.includes(c)) : !codes.length;
  });
  const ex = $('#extras');
  if (ex) ex.hidden = [...ex.querySelectorAll('.opt')].every((r) => r.hidden);
  if (codes.length) $('#sess-msg')?.classList.remove('show');
}

/* ── 驗證與送出 ─────────────────────────────────────── */
function setErr(name, msg) {
  const f = $(`.field[data-f="${name}"]`);
  if (!f) return;
  f.classList.toggle('bad', !!msg);
  $('.msg', f).textContent = msg || '';
}
function collect() {
  const v = (n) => ($(`#f-${n}`).value || '').trim();
  const options = {};
  document.querySelectorAll('#extras .opt').forEach((row) => {
    if (row.hidden) return;
    const inp = $('input,select', row);
    const key = row.dataset.key;
    if (inp.type === 'checkbox') { if (inp.checked) options[key] = '1'; } else if (parseInt(inp.value, 10) > 0) options[key] = inp.value;
  });
  return { name: v('name'), outlet: v('outlet'), email: v('email'), phone: v('phone'), sessions: selectedCodes(), options };
}
function validate(d) {
  const errs = {};
  if (!d.name) errs.name = '請填寫姓名'; else if (d.name.length < 2) errs.name = '姓名至少 2 個字';
  if (!d.outlet) errs.outlet = '請填寫媒體或服務單位';
  if (!d.email) errs.email = '請填寫 Email'; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) errs.email = 'Email 格式好像不對，請再確認';
  const p = digitsOnly(d.phone);
  if (!d.phone) errs.phone = '請填寫手機號碼'; else if (!/^(\+?886)?0?9\d{8}$|^0\d{8,10}$|^\+[1-9]\d{7,14}$/.test(p)) errs.phone = '手機號碼格式好像不對（例如 0912-345-678）';
  return errs;
}
async function onSubmit(e) {
  e.preventDefault();
  if (submitting) return;
  const d = collect();
  const errs = validate(d);
  ['name', 'outlet', 'email', 'phone'].forEach((n) => setErr(n, errs[n]));
  const msg = $('#sess-msg');
  const noSess = !d.sessions.length;
  msg.textContent = noSess ? '請至少勾選一個場次' : '';
  msg.classList.toggle('show', noSess);
  const firstBad = ['name', 'outlet', 'email', 'phone'].find((n) => errs[n]);
  if (firstBad || noSess) {
    const target = firstBad ? $(`#f-${firstBad}`) : $('#sess-card');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (firstBad) target.focus({ preventScroll: true });
    return;
  }
  submitting = true;
  const btn = $('#go');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await api('reg_submit', {
      c: campaign.id, ...d, t: EDIT_TOKEN || undefined, lu: LINE_TOKEN || undefined,
      hp: $('input[name=website]').value, elapsed: Date.now() - loadedAt
    });
    if (r.ok && r.data.ok) return renderDone(r.data, d);
    if (r.data.errors) r.data.errors.forEach((x) => { if (x.field === 'sessions') { msg.textContent = x.message; msg.classList.add('show'); } else setErr(x.field, x.message); });
    showBanner('err', r.data.error || '送出失敗，請再試一次。');
    if (r.data.closed) init();
  } catch {
    showBanner('err', '網路好像不穩，您填的資料都還在，請再按一次送出。');
  } finally {
    submitting = false;
    if ($('#go')) { $('#go').disabled = false; $('#go').textContent = label; }
  }
}
function showBanner(kind, text) {
  $('#top-banner')?.remove();
  const b = el('div', { class: `banner ${kind}`, id: 'top-banner', role: 'alert', text });
  $('#f').before(b);
  b.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function forgetMe() {
  store.del(storeKey()); EDIT_TOKEN = ''; editing = null;
  renderForm({});
}
async function onCancelReg() {
  if (!confirm('確定要取消整筆報名嗎？取消後名額不會保留。')) return;
  const r = await api('reg_cancel', { c: campaign.id, t: EDIT_TOKEN }).catch(() => null);
  if (!r || !r.ok) return showBanner('err', (r && r.data.error) || '取消失敗，請稍後再試。');
  store.del(storeKey()); EDIT_TOKEN = ''; editing = null;
  $('#app').replaceChildren(el('div', { class: 'card center done' }, el('h2', { text: '已取消您的報名' }),
    el('p', { class: 'hint', text: '如果之後想再採訪，隨時可以重新報名。' }),
    el('button', { class: 'btn ghost', style: 'margin-top:14px', type: 'button', text: '重新報名', onclick: () => renderForm({}) })), contactFooter());
  scrollTo(0, 0);
}

/* ── 完成頁 ─────────────────────────────────────────── */
function renderDone(data, sent) {
  if (data.token) { EDIT_TOKEN = data.token; store.set(storeKey(), data.token); }
  const reg = data.reg;
  const title = { created: '報名完成', reopened: '報名完成', merged: '已更新您的報名', edited: '已儲存修改' }[data.mode] || '報名完成';
  const nodes = [];
  if (data.test) nodes.push(el('div', { class: 'banner warn', text: '這是測試報名（活動尚未公開），不會列入統計。' }));
  const card = el('div', { class: 'card done' },
    el('div', { class: 'ok', text: '✓', 'aria-hidden': 'true' }),
    el('h2', { text: title }),
    el('div', { class: 'who', text: `${reg.name || sent.name}｜${reg.outlet || sent.outlet}` }));
  if (data.mode === 'merged') card.append(el('p', { class: 'hint', style: 'margin-top:6px', text: '這次勾選的場次已加進您先前的報名。姓名、手機等資料沒有更動；要改請用當初報名後的「修改這筆報名」連結，或洽媒體聯絡人。' }));
  const ul = el('ul', { class: 'sum-list' });
  (reg.session_labels || []).forEach((t) => {
    const m = t.match(/^(\S+)\s+(.*)$/);
    ul.append(el('li', {}, m ? el('b', { text: m[1] }) : null, m ? m[2] : t));
  });
  card.append(el('div', { class: 'hint', style: 'margin-top:16px;text-align:left', text: data.mode === 'merged' ? `這次加入 ${reg.sessions.length} 場` : `已報名 ${reg.sessions.length} 場` }), ul);
  if (reg.reg_id) card.append(el('div', { class: 'regno', text: `報名編號 ${reg.reg_id}` }));
  const acts = el('div', { style: 'margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center' });
  if (EDIT_TOKEN) acts.append(el('button', { class: 'btn ghost', type: 'button', text: '修改這筆報名', onclick: async () => {
    const g = await api('reg_get', null, { c: campaign.id, t: EDIT_TOKEN }).catch(() => null);
    editing = g && g.ok ? g.data.reg : null; renderForm(); scrollTo(0, 0);
  } }));
  else acts.append(el('p', { class: 'hint', text: '如需刪減場次，請洽媒體聯絡人。' }));
  card.append(acts);
  nodes.push(card);
  const lc = lineCard(data.line || {});
  if (lc) nodes.push(lc);
  nodes.push(contactFooter());
  $('#app').replaceChildren(...nodes);
  scrollTo(0, 0);
}

// LINE 導流（批次 89 縮小）：只在報名完成之後、只有一行小字＋加好友連結。
// 不再放「用 LINE 連結我的報名」按鈕與 QR——記者不會點，「有沒有連結」對他沒有差別，只對我們有。
// 從米亞卡片點進來填的人，送出時就已經自動連結了（不需要他多做任何事）。
function lineCard(line) {
  if (line.bound) return el('p', { class: 'hint', style: 'text-align:center', text: '✓ 已連結您的 LINE，米亞會認得您的報名。' });
  if (!line.add_friend_url) return null;
  const pitch = (campaign.line_pitch || [])[0] || '議程、交通、報到時間，隨時問米亞';
  return el('p', { class: 'hint', style: 'text-align:center' }, `${pitch}　`,
    el('a', { href: line.add_friend_url, target: '_blank', rel: 'noopener', text: '加米亞好友（選用）' }));
}

function contactFooter() {
  const f = el('footer', { class: 'contact' });
  if (campaign && campaign.contact) { f.append('媒體聯絡人\n'); f.append(linkify(campaign.contact)); }
  return f;
}

init();
</script>
</body>
</html>
