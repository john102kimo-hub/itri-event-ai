<!doctype html>
<!--
  public/richmenu.png 的原始檔。這個目錄不會被 Vercel 部署（只有 public/ 是靜態資源），
  留在這裡是為了之後要改選單文案時不用重畫。

  改完重新產圖（開發機要有 Chromium）：
    chromium --headless --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=2500,843 --screenshot=public/richmenu.png \
      --default-background-color=FFFFFFFF file://$PWD/assets/richmenu.source.html

  ⚠️ 三格的文字若有更動，lib/menu.js 的 RICH_MENU_BUTTONS 與 detectMetaIntent()
  要一起改——按鈕送出的字沒被意圖判斷認出來，就會變成「按了沒反應」。
  改完要在 LINE 用職員模式重打一次「設定圖文選單」才會生效。
-->
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<style>
  /* 2500x843 是 LINE 圖文選單「精簡版」的規定尺寸，一個像素都不能差。
     這份 HTML 只在開發機用 Chromium 截圖一次產出 public/richmenu.png，
     不會被部署或在執行期用到。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2500px; height: 843px; overflow: hidden; }
  body {
    font-family: "WenQuanYi Zen Hei", "Noto Sans CJK TC", sans-serif;
    background: #FFFFFF;
  }
  /* 頂端一條主色：圖文選單貼著聊天室下緣，這條是選單與對話內容的分界，
     沒有它整塊白會跟聊天背景糊在一起 */
  .accent { height: 14px; background: #0F9E7A; }
  .row { display: flex; height: 829px; }
  .cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    position: relative;
  }
  /* 分隔線用 ::after 畫，不用 border——border 會吃掉 flex 的寬度，
     三格就不會剛好各占 1/3，跟 buildRichMenuDefinition() 算出來的可點區域對不齊 */
  .cell:not(:last-child)::after {
    content: "";
    position: absolute; right: 0; top: 120px; bottom: 120px;
    width: 3px; background: #E8ECEA;
  }
  .icon {
    width: 168px; height: 168px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 84px; line-height: 1;
    background: #E7F6F1;
  }
  .label {
    font-size: 70px; font-weight: 700; color: #14202E; letter-spacing: 2px;
  }
  .sub {
    font-size: 42px; color: #7C8794; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="row">
    <div class="cell">
      <div class="icon">📅</div>
      <div class="label">最近有哪些活動</div>
      <div class="sub">看場次清單</div>
    </div>
    <div class="cell">
      <div class="icon">🔄</div>
      <div class="label">換一場活動</div>
      <div class="sub">切換問答場次</div>
    </div>
    <div class="cell">
      <div class="icon">💡</div>
      <div class="label">使用說明</div>
      <div class="sub">第一次使用看這裡</div>
    </div>
  </div>
</body>
</html>
